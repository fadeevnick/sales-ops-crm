services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salesops}
      POSTGRES_USER: ${POSTGRES_USER:-salesops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesops} -d ${POSTGRES_DB:-salesops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: gradle:8.14.3-jdk21
    working_dir: /workspace
    command: gradle bootRun --no-daemon
    restart: on-failure
    environment:
      PORT: ${BACKEND_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-salesops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-salesops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salesops}
      APP_ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/workspace
      - gradle_cache:/home/gradle/.gradle

  frontend:
    image: node:22
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules

volumes:
  postgres_data:
  gradle_cache:
  frontend_node_modules:
