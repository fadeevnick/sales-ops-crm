server {
    listen 80;
    server_name sales-ops-crm.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sales-ops-crm.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/sales-ops-crm.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales-ops-crm.duckdns.org/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
