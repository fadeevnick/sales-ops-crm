<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sales Ops CRM — App Shell</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F1EB;
    --paper-2:#EEEAE0;
    --paper-3:#E6E1D4;
    --ink:#17150F;
    --ink-2:#3A372E;
    --muted:#6E6A5C;
    --muted-2:#8C8779;
    --line:#D6D0BF;
    --line-2:#C4BDA8;
    --hairline:#E4DFD0;
    --accent:#B57321;          /* ochre */
    --accent-2:#8A5616;
    --accent-soft:#F2E3C8;
    --pos:#3F6B3A;             /* approved */
    --pos-soft:#E2EAD6;
    --neg:#9A3A2F;             /* rejected / blocked */
    --neg-soft:#F0DAD3;
    --warn:#A36A11;            /* pending / warn */
    --warn-soft:#F4E3C1;
    --info:#2D5B6B;            /* sent back / info */
    --info-soft:#D6E1E4;
    --white:#FBFAF6;
    font-family:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-feature-settings:"ss01","cv11","tnum";
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-feature-settings:"tnum","ss02";}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent-soft);color:var(--ink)}

  /* ─────────── App layout ─────────── */
  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh;}
  .sidebar{
    background:var(--paper-2);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .main{display:flex;flex-direction:column;min-width:0}

  /* ─────────── Sidebar ─────────── */
  .brand{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;gap:10px;
  }
  .brand-mark{
    width:22px;height:22px;flex:0 0 22px;position:relative;
  }
  .brand-mark::before,.brand-mark::after{
    content:"";position:absolute;inset:0;border:1.5px solid var(--ink);
  }
  .brand-mark::after{inset:5px;background:var(--accent);border-color:var(--accent-2);}
  .brand-name{font-weight:600;letter-spacing:.02em;font-size:14px}
  .brand-name span{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}

  .tenant{
    padding:12px 18px;border-bottom:1px solid var(--hairline);
    display:flex;flex-direction:column;gap:4px;
  }
  .tenant-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .tenant-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .tenant-name{font-weight:600;font-size:13.5px}
  .tenant-env{
    font-family:"JetBrains Mono",monospace;font-size:10px;
    padding:2px 6px;border:1px solid var(--line-2);border-radius:2px;
    color:var(--muted);background:var(--paper);letter-spacing:.04em;
  }
  .tenant-meta{display:flex;gap:8px;font-size:11px;color:var(--muted)}
  .tenant-meta .dot{color:var(--line-2)}

  .nav{flex:1;overflow:auto;padding:10px 0 12px;}
  .nav-section{margin-top:14px}
  .nav-section:first-child{margin-top:8px}
  .nav-title{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);
    padding:6px 18px 4px;display:flex;justify-content:space-between;align-items:center;
  }
  .nav-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--line-2);letter-spacing:.05em;}
  .nav-item{
    display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;
    padding:7px 18px 7px 14px;
    border-left:2px solid transparent;
    color:var(--ink-2);font-size:13px;cursor:pointer;
    position:relative;
  }
  .nav-item:hover{background:var(--paper-3);color:var(--ink)}
  .nav-item.active{
    background:var(--paper-3);border-left-color:var(--accent);color:var(--ink);font-weight:500;
  }
  .nav-mark{
    width:22px;height:22px;display:grid;place-items:center;
    border:1px solid var(--line-2);background:var(--white);
    font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:600;
    letter-spacing:.04em;color:var(--ink-2);
  }
  .nav-item.active .nav-mark{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
  .nav-label{display:flex;align-items:baseline;gap:8px;min-width:0}
  .nav-label small{color:var(--muted);font-weight:400;font-size:11px;}
  .nav-count{
    font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);
    min-width:18px;text-align:right;
  }
  .nav-count.alert{color:var(--accent-2);font-weight:600}
  .nav-item.disabled{opacity:.35;pointer-events:none}
  .nav-item.disabled .nav-mark{background:transparent}

  .user-block{
    border-top:1px solid var(--line);
    padding:12px 14px;display:flex;align-items:center;gap:10px;
    background:var(--paper-2);
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--ink);color:var(--paper);
    font-size:11px;font-weight:600;letter-spacing:.04em;
    flex:0 0 30px;border:1px solid var(--ink);
  }
  .avatar.bg-a{background:#2D3E2C;border-color:#2D3E2C}
  .avatar.bg-b{background:#5C3A1E;border-color:#5C3A1E}
  .avatar.bg-c{background:#2A4655;border-color:#2A4655}
  .avatar.bg-d{background:#6B2E2E;border-color:#6B2E2E}
  .avatar.bg-e{background:#3D2A55;border-color:#3D2A55}
  .avatar.bg-f{background:#5D562A;border-color:#5D562A}
  .user-meta{display:flex;flex-direction:column;min-width:0;flex:1}
  .user-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch-btn{
    border:1px solid var(--line-2);padding:5px 8px;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-2);background:var(--paper);
    border-radius:2px;font-family:"JetBrains Mono",monospace;
  }
  .switch-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ─────────── Top bar ─────────── */
  .topbar{
    height:56px;border-bottom:1px solid var(--line);
    background:var(--paper);
    display:grid;grid-template-columns:1fr minmax(280px,440px) auto;
    align-items:center;gap:20px;padding:0 22px;
    position:sticky;top:0;z-index:5;
  }
  .crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
  .crumb strong{color:var(--ink);font-weight:600;font-size:13.5px}
  .crumb .sep{color:var(--line-2)}
  .crumb .pulse{
    display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;
    font-size:10.5px;color:var(--muted);padding:3px 7px;border:1px solid var(--line-2);
    border-radius:2px;background:var(--paper-2);letter-spacing:.04em;
  }
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 2px var(--pos-soft)}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--paper-2);
    border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:12.5px;color:var(--muted);
  }
  .search:focus-within{border-color:var(--ink);background:var(--white)}
  .search svg{flex:0 0 14px;color:var(--muted)}
  .search input{
    border:0;background:transparent;outline:none;flex:1;font:inherit;color:var(--ink);
  }
  .search kbd{
    font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);
    border:1px solid var(--line-2);border-radius:2px;padding:1px 5px;background:var(--paper);
  }
  .top-actions{display:flex;align-items:center;gap:10px}
  .icon-btn{
    width:32px;height:32px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:3px;background:var(--paper);
    color:var(--ink-2);position:relative;
  }
  .icon-btn:hover{border-color:var(--ink);color:var(--ink)}
  .icon-btn .dot-badge{
    position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;padding:0 3px;
    background:var(--accent);color:var(--white);font-family:"JetBrains Mono",monospace;
    font-size:9px;font-weight:600;border-radius:7px;display:grid;place-items:center;
    border:1.5px solid var(--paper);
  }
  .role-pill{
    display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;
    border:1px solid var(--line);border-radius:18px;background:var(--paper);
  }
  .role-pill:hover{border-color:var(--ink)}
  .role-pill .avatar{width:26px;height:26px;flex:0 0 26px;font-size:10px}
  .role-pill .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .role-pill .who b{font-size:12px;font-weight:600}
  .role-pill .who span{font-size:10.5px;color:var(--muted)}
  .role-pill .chev{color:var(--muted);margin-left:2px}

  /* ─────────── Role switcher popover ─────────── */
  .popover-wrap{position:relative}
  .popover{
    position:absolute;top:calc(100% + 8px);right:0;
    background:var(--white);border:1px solid var(--line);
    border-radius:4px;box-shadow:0 8px 24px rgba(20,18,12,.12),0 2px 6px rgba(20,18,12,.06);
    width:340px;z-index:30;overflow:hidden;
  }
  .popover-head{
    padding:10px 14px;border-bottom:1px solid var(--hairline);
    font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  .popover-head em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--muted-2);letter-spacing:.05em}
  .user-row{
    display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
    padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--hairline);
  }
  .user-row:last-child{border-bottom:0}
  .user-row:hover{background:var(--paper-2)}
  .user-row.active{background:var(--accent-soft)}
  .user-row .meta{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .user-row .meta b{font-size:12.5px;font-weight:500}
  .user-row .meta span{font-size:11px;color:var(--muted)}
  .role-badge{
    font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;
    padding:2px 6px;border-radius:2px;border:1px solid var(--line-2);
    color:var(--muted);background:var(--paper);text-transform:uppercase;
  }
  .role-badge.r-rep{color:#2D5B6B;border-color:#A4C0C8;background:var(--info-soft)}
  .role-badge.r-mgr{color:#5C3A1E;border-color:#D9BFA0;background:#F0E2CE}
  .role-badge.r-ops{color:#3D2A55;border-color:#BFAED9;background:#E4DBF0}
  .role-badge.r-fin{color:#3F6B3A;border-color:#B2C8A8;background:var(--pos-soft)}
  .role-badge.r-leg{color:#6B2E2E;border-color:#D6B0A8;background:var(--neg-soft)}
  .role-badge.r-exe{color:#17150F;border-color:#C4BDA8;background:var(--paper-3)}

  /* ─────────── Main content ─────────── */
  .content{padding:20px 26px 60px;max-width:1400px;}
  .page-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:14px;border-bottom:1px solid var(--hairline);margin-bottom:18px;
  }
  .page-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
  .page-title em{font-style:normal;color:var(--muted);font-weight:400}
  .page-sub{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:6px}
  .page-sub .mono{color:var(--ink-2)}
  .page-sub .sep{color:var(--line-2)}
  .page-actions{display:flex;gap:8px;align-items:center}
  .btn{
    border:1px solid var(--line-2);background:var(--paper);
    padding:7px 12px;font-size:12px;color:var(--ink);border-radius:3px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--ink)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn .kbd{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);}
  .btn-primary .kbd{color:var(--paper-3)}

  /* KPI strip */
  .kpis{
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    border:1px solid var(--line);background:var(--white);margin-bottom:18px;
  }
  .kpi{padding:14px 16px;border-right:1px solid var(--hairline);position:relative}
  .kpi:last-child{border-right:0}
  .kpi-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .kpi-label .delta{font-family:"JetBrains Mono",monospace;letter-spacing:0;text-transform:none;font-size:11px;}
  .kpi-label .delta.up{color:var(--pos)}
  .kpi-label .delta.dn{color:var(--neg)}
  .kpi-value{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:500;margin-top:6px;letter-spacing:-.01em}
  .kpi-value small{font-size:13px;color:var(--muted);margin-left:4px}
  .kpi-foot{font-size:11.5px;color:var(--muted);margin-top:4px}

  /* Panels & tables */
  .row{display:grid;gap:18px}
  .row.r-2-1{grid-template-columns:2fr 1fr}
  .row.r-1-1{grid-template-columns:1fr 1fr}
  .row.r-3-2{grid-template-columns:3fr 2fr}

  .panel{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;border-bottom:1px solid var(--hairline);
  }
  .panel-title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
  .panel-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.02em;text-transform:none}
  .panel-actions{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11.5px}
  .panel-actions a{border-bottom:1px dotted var(--line-2)}
  .panel-actions a:hover{color:var(--ink);border-color:var(--ink)}
  .filterchip{
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;
    border:1px solid var(--line-2);padding:2px 6px;border-radius:2px;color:var(--ink-2);background:var(--paper);
  }
  .filterchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  table.t{width:100%;border-collapse:collapse;table-layout:fixed}
  table.t th, table.t td{
    text-align:left;padding:8px 14px;border-bottom:1px solid var(--hairline);
    font-size:12.5px;vertical-align:middle;
  }
  table.t th{
    font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    font-weight:500;background:var(--paper-2);border-bottom:1px solid var(--line);
    padding:6px 14px;
  }
  table.t td.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
  table.t tr:hover td{background:#FBF7EB}
  table.t .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.t td .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  table.t .num{font-family:"JetBrains Mono",monospace;text-align:right;font-variant-numeric:tabular-nums}
  table.t th.num{text-align:right}

  /* Stage pip */
  .stage-pip{display:inline-flex;gap:3px;align-items:center;margin-right:6px;vertical-align:middle}
  .stage-pip i{width:6px;height:10px;background:var(--line);display:block}
  .stage-pip i.on{background:var(--ink)}
  .stage-pip i.flag{background:var(--accent)}

  /* Status pills */
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.04em;
    padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);background:var(--paper);
    text-transform:uppercase;
  }
  .pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .pill.p-pending{color:var(--warn);border-color:#E2C887;background:var(--warn-soft)}
  .pill.p-pending .pdot{background:var(--warn)}
  .pill.p-approved{color:var(--pos);border-color:#B2C8A8;background:var(--pos-soft)}
  .pill.p-approved .pdot{background:var(--pos)}
  .pill.p-rejected{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
  .pill.p-rejected .pdot{background:var(--neg)}
  .pill.p-sentback{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}
  .pill.p-sentback .pdot{background:var(--info)}
  .pill.p-none{color:var(--muted)}
  .pill.p-running{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}
  .pill.p-running .pdot{background:var(--info);animation:bp 1.6s infinite}
  @keyframes bp{50%{opacity:.3}}

  /* Activity / list items */
  .list{display:flex;flex-direction:column}
  .list-item{
    display:grid;grid-template-columns:60px 1fr auto;gap:12px;
    padding:10px 14px;border-bottom:1px solid var(--hairline);align-items:start;
  }
  .list-item:last-child{border-bottom:0}
  .list-time{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);padding-top:1px}
  .list-time.due{color:var(--accent-2);font-weight:600}
  .list-time.over{color:var(--neg)}
  .list-body{min-width:0}
  .list-title{font-size:12.5px;font-weight:500;line-height:1.35}
  .list-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
  .list-meta .sep{color:var(--line-2)}
  .list-action{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);padding-top:2px;text-transform:uppercase;letter-spacing:.08em}
  .list-action.act{color:var(--accent-2)}

  /* Funnel / bar viz */
  .funnel{padding:6px 14px 14px}
  .funnel-row{display:grid;grid-template-columns:128px 1fr 80px 84px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hairline);}
  .funnel-row:last-child{border-bottom:0}
  .funnel-stage{font-size:12px;display:flex;align-items:center;gap:8px}
  .funnel-stage .ix{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);width:18px}
  .funnel-bar{height:14px;position:relative;background:var(--paper-2);border:1px solid var(--hairline)}
  .funnel-bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);}
  .funnel-bar .fill.acc{background:var(--accent)}
  .funnel-bar .fill.warn{background:var(--warn)}
  .funnel-bar .marker{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-2)}
  .funnel-num{font-family:"JetBrains Mono",monospace;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  .funnel-pct{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);text-align:right}

  /* Empty hint when role can't see module */
  .role-hint{
    font-size:11px;color:var(--muted-2);padding:8px 18px;
    border-top:1px solid var(--hairline);font-style:italic;letter-spacing:.01em;
  }

  /* Foot ruler */
  .foot-ruler{
    margin-top:24px;border-top:1px solid var(--hairline);padding-top:10px;
    display:flex;justify-content:space-between;color:var(--muted);font-size:11px;
    font-family:"JetBrains Mono",monospace;letter-spacing:.04em;
  }

  /* Risk row mini */
  .riskrow{
    display:grid;grid-template-columns:1fr 64px 80px;align-items:center;gap:10px;
    padding:9px 14px;border-bottom:1px solid var(--hairline);
  }
  .riskrow:last-child{border-bottom:0}
  .riskrow .nm{font-size:12.5px}
  .riskrow .nm small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .riskrow .num{font-family:"JetBrains Mono",monospace;font-size:12px;text-align:right}
  .riskrow .age{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--neg);text-align:right}

  /* mini stat list */
  .ministat{display:flex;flex-direction:column}

const ROLE_ACCESS = {

  leg: ["dashboard","approvals","accounts","opps","audit"],
  exe: ["dashboard","reports"],
};

// Counts (badges next to nav items). Some role-dependent.
function navCounts(roleKey){
  const base = {
    accounts:412, contacts:1843, opps:128,
    imports:2, duplicates:24, metadata:3, audit:0, reports:0,
  };
  if(roleKey==="rep") return { ...base, opps:12, approvals:3 };
  if(roleKey==="mgr") return { ...base, opps:46, approvals:7 };
  if(roleKey==="ops") return { ...base, approvals:0 };
  if(roleKey==="fin") return { approvals:9, opps:46, accounts:412, audit:0 };
  if(roleKey==="leg") return { approvals:4, opps:46, accounts:412, audit:0 };
  if(roleKey==="exe") return { reports:0 };

/* ─────────── Layout primitives ─────────── */

function BrandMark(){ return <span className="brand-mark" aria-hidden /> }

function Sidebar({ user, activeModule, onSelectModule, onOpenSwitcher }){

      <div className="tenant">

          <div className="tenant-env mono">LOCAL PILOT</div>

          <span className="mono">EU-CENTRAL-1</span>
          <span className="dot">·</span>
          <span>184 seats</span>
        </div>
      </div>

      <nav className="nav">
        {SECTIONS.map(sec => {
          const items = MODULES.filter(m => m.section === sec.key);

          return (
            <div key={sec.key} className="nav-section">
              <div className="nav-title">{sec.label}<em>{sec.index}</em></div>
              {items.map(m => {
                const allowed = access.includes(m.key);
                const c = counts[m.key];
                const alert = (m.key==="approvals" && c>0 && (user.roleKey==="fin"||user.roleKey==="leg"||user.roleKey==="rep"||user.roleKey==="mgr"))
                            || (m.key==="duplicates" && c>0 && user.roleKey==="ops")

                  <div

                    <span className="nav-mark mono">{m.code}</span>
                    <span className="nav-label">{m.label}</span>
                    <span className={`nav-count mono ${alert?"alert":""}`}>

        </div>
      </div>
    </div>
  );
}

/* ─────────── Shared bits ─────────── */

function Pill({ kind, children }){
  return <span className={`pill p-${kind}`}><span className="pdot" />{children}</span>;
}

function StagePip({ stage }){
  // Pipeline stages: Q (Qualification), D (Discovery), P (Proposal), N (Negotiation), W (Closed Won), L (Closed Lost)
  const stages = ["Q","D","P","N","W"];
  const flag = stage === "FLAG";
  return (
    <span className="stage-pip">
      {stages.map((s,i)=>{
        const idx = ["Q","D","P","N","W"].indexOf(stage);
        const isOn = i <= idx;
        return <i key={s} className={isOn ? (flag?"flag":"on") : ""} />;
      })}
    </span>
  );
}

function fmtMoney(n){
  if(n>=1_000_000) return `$${(n/1_000_000).toFixed(2)}M`;
  if(n>=1_000) return `$${(n/1_000).toFixed(0)}K`;
  return `$${n}`;
}

function PageHead({ title, sub, actions }){
  return (
    <div className="page-head">
      <div>
        <h1 className="page-title">{title}</h1>
        <div className="page-sub">{sub}</div>
      </div>
      {actions && <div className="page-actions">{actions}</div>}
    </div>
  );
}

function Kpi({ label, value, unit, delta, foot }){
  return (
    <div className="kpi">
      <div className="kpi-label">
        <span>{label}</span>
        {delta && <span className={`delta ${delta.dir}`}>{delta.dir==="up"?"▲":"▼"} {delta.v}</span>}
      </div>
      <div className="kpi-value">{value}{unit && <small>{unit}</small>}</div>
      <div className="kpi-foot">{foot}</div>
    </div>
  );
}

function Panel({ title, count, actions, children, filters }){
  return (
    <section className="panel">
      <div className="panel-head">
        <div className="panel-title">
          {title}
          {count !== undefined && <em>{count}</em>}
        </div>
        <div className="panel-actions">
          {filters}
          {actions}
        </div>
      </div>
      {children}
    </section>
  );
}

                  <div className={`fill ${b.flag?"acc":""}`} style={{width:`${b.pct}%`}} />
                </div>
                <div className="funnel-num" style={{color:b.flag?"var(--accent-2)":"var(--ink)"}}>{b.v}</div>
              </div>
            ))}
          </div>
        </Panel>
      </div>

      <div style={{height:18}} />

      <div className="row r-1-1">
        <Panel title="Top deals at risk" count="4" actions={<a>Drill ›</a>}>
          {risk.map((d,i)=>(
            <div key={i} className="riskrow">
              <div className="nm">
                {d.acct}
                <small>{d.owner} · {d.stage}</small>
              </div>
              <div className="num">{fmtMoney(d.amt)}</div>
              <div className="age">{d.age}</div>
            </div>
          ))}
        </Panel>

        <Panel title="Operational trust signals" count="—">
          <div className="ministat">
            {[
              { lbl:"Reporting projection · pipeline", v:"FRESH", note:"Refreshed 09:39 today · lag 3 min" },
              { lbl:"Open imports affecting metrics",  v:"2", note:"Accounts, Contacts — refresh pending" },
              { lbl:"Open duplicate candidates",       v:"24", note:"5 high-confidence — may move totals" },
              { lbl:"Unresolved metadata drafts",      v:"3", note:"None affect reporting dimensions" },
              { lbl:"Audit coverage · 30d",             v:"100%", note:"All approvals, merges, config changes" },
            ].map((p,i)=>(
              <div key={i} className="ministat-row" style={{gridTemplateColumns:"1fr 90px"}}>
                <div className="lbl">{p.lbl}<small>{p.note}</small></div>
                <div className={`v ${p.v==="FRESH"?"":(p.v==="2"||p.v==="24"||p.v==="3")?"warn":""}`}>{p.v}</div>
              </div>
            ))}
          </div>
        </Panel>
      </div>
    </>
  );
}

const LANDINGS = {
  rep: { Comp: RepLanding, title:"My workspace", sub:["Sales Representative landing","Q2 2026","Owner-scoped view"] },
  mgr: { Comp: MgrLanding, title:"Team operations", sub:["Sales Manager landing","Team · DACH-North","Q2 2026"] },
  ops: { Comp: OpsLanding, title:"Operations control room", sub:["RevOps Administrator landing","Tenant Orion Industrial","All systems"] },
  fin: { Comp: FinanceLanding, title:"Finance approval desk", sub:["Finance Approver landing","Routed by policy v18","SLA target ≤ 24h"] },
  leg: { Comp: LegalLanding, title:"Legal approval desk", sub:["Legal Approver landing","Routed by policy v18","SLA target ≤ 48h"] },
  exe: { Comp: ExecLanding, title:"Executive overview", sub:["Executive landing","All teams · all regions","Q2 2026"] },
};

/* ─────────── Shell ─────────── */

function App(){
  const [userId, setUserId] = useState("u1");
  const user = useMemo(()=>USERS.find(u=>u.id===userId), [userId]);
  const access = ROLE_ACCESS[user.roleKey];
  const [activeModule, setActiveModule] = useState("dashboard");
  const [switcherOpen, setSwitcherOpen] = useState(false);
  const popRef = useRef(null);

  // Reset active module if not visible under new role
  useEffect(()=>{
    if(!access.includes(activeModule)) setActiveModule("dashboard");
  }, [user.roleKey]);

  // close popover on outside click / Esc
  useEffect(()=>{
    if(!switcherOpen) return;
    const onDown = (e) => {
      if(popRef.current && !popRef.current.contains(e.target) && !e.target.closest(".role-pill") && !e.target.closest(".switch-btn")){
        setSwitcherOpen(false);
      }
    };
    const onKey = (e) => { if(e.key==="Escape") setSwitcherOpen(false); };
    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);
    return ()=>{ document.removeEventListener("mousedown", onDown); document.removeEventListener("keydown", onKey); };
  }, [switcherOpen]);

  const activeMod = MODULES.find(m=>m.key===activeModule);
  const landing = LANDINGS[user.roleKey];
  const today = new Date(2026,4,12); // May 12 2026
  const dateStr = today.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });

  return (
    <div className="app">
      <Sidebar
        user={user}
        activeModule={activeModule}
        onSelectModule={setActiveModule}
        onOpenSwitcher={()=>setSwitcherOpen(s=>!s)}
      />
      <div className="main">
        <TopBar
          user={user}
          activeLabel={activeMod?.label || "Dashboard"}
          onOpenSwitcher={()=>setSwitcherOpen(s=>!s)}
          switcherOpen={switcherOpen}
          popoverRef={popRef}
          onPickUser={(u)=>{ setUserId(u.id); setSwitcherOpen(false); }}
        />

        <div className="content">
          <PageHead
            title={<>{landing.title} <em style={{fontWeight:400}}>· {dateStr.split(",")[0]}</em></>}
            sub={<>
              <span className="mono">{user.roleCode}</span>
              <span className="sep">/</span>
              <span>{landing.sub[0]}</span>
              {landing.sub.slice(1).map((s,i)=>(<React.Fragment key={i}><span className="sep">·</span><span>{s}</span></React.Fragment>))}
              <span className="sep">·</span>
              <span className="mono">{dateStr}</span>
            </>}
            actions={
              user.roleKey==="rep" ? <>
                <button className="btn">New activity</button>
                <button className="btn-primary btn">New opportunity <span className="kbd">N</span></button>
              </> :
              user.roleKey==="mgr" ? <>
                <button className="btn">Export pipeline</button>
                <button className="btn-primary btn">Open team report</button>
              </> :
              user.roleKey==="ops" ? <>
                <button className="btn">New import</button>
                <button className="btn-primary btn">Publish metadata draft</button>
              </> :
              user.roleKey==="fin" ? <>
                <button className="btn">Bulk decide</button>
                <button className="btn-primary btn">Open next request <span className="kbd">↵</span></button>
              </> :
              user.roleKey==="leg" ? <>
                <button className="btn">Bulk decide</button>
                <button className="btn-primary btn">Open next request <span className="kbd">↵</span></button>
              </> :
              <button className="btn-primary btn">Open Reports</button>
            }
          />

          <landing.Comp />

          <div className="foot-ruler">
            <span>SALES OPS CRM · ORION INDUSTRIAL · LOCAL PILOT</span>
            <span>USER {user.roleCode} · {user.initials}</span>
            <span>POLICY v18 · METADATA v42 · SHELL v2.4</span>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
