<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sales Ops CRM — Approval Request Detail</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────── Design tokens ─────────── */
:root{
  --paper:#F4F1EB; --paper-2:#EEEAE0; --paper-3:#E6E1D4;
  --ink:#17150F; --ink-2:#3A372E;
  --muted:#6E6A5C; --muted-2:#8C8779;
  --line:#D6D0BF; --line-2:#C4BDA8; --hairline:#E4DFD0;
  --accent:#B57321; --accent-2:#8A5616; --accent-soft:#F2E3C8;
  --pos:#3F6B3A; --pos-soft:#E2EAD6;
  --neg:#9A3A2F; --neg-soft:#F0DAD3;
  --warn:#A36A11; --warn-soft:#F4E3C1;
  --info:#2D5B6B; --info-soft:#D6E1E4;
  --white:#FBFAF6; --select:#FBF1DC;
  font-family:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-feature-settings:"ss01","cv11","tnum";
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-feature-settings:"tnum","ss02"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-soft);color:var(--ink)}

/* ─────────── App layout ─────────── */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.sidebar{background:var(--paper-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.main{display:flex;flex-direction:column;min-width:0}

/* ─────────── Sidebar ─────────── */
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px}
.brand-mark{width:22px;height:22px;flex:0 0 22px;position:relative}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;inset:0;border:1.5px solid var(--ink)}
.brand-mark::after{inset:5px;background:var(--accent);border-color:var(--accent-2)}
.brand-name{font-weight:600;letter-spacing:.02em;font-size:14px}
.brand-name span{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.tenant{padding:12px 18px;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:4px}
.tenant-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tenant-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tenant-name{font-weight:600;font-size:13.5px}
.tenant-env{
  font-family:"JetBrains Mono",monospace;font-size:10px;padding:2px 6px;
  border:1px solid #D9BFA0;border-radius:2px;color:var(--accent-2);background:var(--warn-soft);letter-spacing:.04em
}
.tenant-meta{display:flex;gap:8px;font-size:11px;color:var(--muted)}
.tenant-meta .dot{color:var(--line-2)}
.nav{flex:1;overflow:auto;padding:10px 0 12px}
.nav-section{margin-top:14px}
.nav-section:first-child{margin-top:8px}
.nav-title{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);
  padding:6px 18px 4px;display:flex;justify-content:space-between;align-items:center
}
.nav-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--line-2);letter-spacing:.05em}
.nav-item{
  display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;
  padding:7px 18px 7px 14px;border-left:2px solid transparent;color:var(--ink-2);font-size:13px;cursor:pointer
}
.nav-item:hover{background:var(--paper-3);color:var(--ink)}
.nav-item.active{background:var(--paper-3);border-left-color:var(--accent);color:var(--ink);font-weight:500}
.nav-mark{
  width:22px;height:22px;display:grid;place-items:center;
  border:1px solid var(--line-2);background:var(--white);
  font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)
}
.nav-item.active .nav-mark{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.nav-count{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);min-width:18px;text-align:right}
.nav-count.alert{color:var(--accent-2);font-weight:600}
.nav-item.disabled{opacity:.35;pointer-events:none}
.nav-label{display:flex;align-items:baseline}
.user-block{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--paper-2)}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.04em;
  flex:0 0 30px;border:1px solid var(--ink)
}
.avatar.bg-a{background:#2D3E2C;border-color:#2D3E2C}
.avatar.bg-b{background:#5C3A1E;border-color:#5C3A1E}
.avatar.bg-c{background:#2A4655;border-color:#2A4655}
.avatar.bg-d{background:#6B2E2E;border-color:#6B2E2E}
.avatar.bg-e{background:#3D2A55;border-color:#3D2A55}
.avatar.bg-f{background:#5D562A;border-color:#5D562A}
.user-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.user-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch-btn{
  border:1px solid var(--line-2);padding:5px 8px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);background:var(--paper);border-radius:2px;
  font-family:"JetBrains Mono",monospace
}
.switch-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ─────────── Top bar ─────────── */
.topbar{
  height:56px;border-bottom:1px solid var(--line);background:var(--paper);
  display:grid;grid-template-columns:1fr minmax(280px,440px) auto;
  align-items:center;gap:20px;padding:0 22px;
  position:sticky;top:0;z-index:10
}
.crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.crumb strong{color:var(--ink);font-weight:600;font-size:13px}
.crumb .sep{color:var(--line-2)}
.crumb .pulse{
  display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;color:var(--accent-2);padding:3px 7px;border:1px solid #D9BFA0;
  border-radius:2px;background:var(--warn-soft);letter-spacing:.04em
}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.search{
  display:flex;align-items:center;gap:8px;background:var(--paper-2);
  border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:12.5px;color:var(--muted)
}
.search:focus-within{border-color:var(--ink);background:var(--white)}
.search svg{flex:0 0 14px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;flex:1;font:inherit;color:var(--ink)}
.search kbd{
  font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);
  border:1px solid var(--line-2);border-radius:2px;padding:1px 5px;background:var(--paper)
}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink-2);position:relative
}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}
.icon-btn .dot-badge{
  position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;padding:0 3px;
  background:var(--accent);color:var(--white);font-family:"JetBrains Mono",monospace;
  font-size:9px;font-weight:600;border-radius:7px;display:grid;place-items:center;
  border:1.5px solid var(--paper)
}
.role-pill{
  display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;
  border:1px solid var(--line);border-radius:18px;background:var(--paper)
}
.role-pill:hover{border-color:var(--ink)}
.role-pill .avatar{width:26px;height:26px;flex:0 0 26px;font-size:10px}
.role-pill .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.role-pill .who b{font-size:12px;font-weight:600}
.role-pill .who span{font-size:10.5px;color:var(--muted)}
.role-pill .chev{color:var(--muted);margin-left:2px}

/* ─────────── Buttons ─────────── */
.btn{
  border:1px solid var(--line-2);background:var(--paper);
  padding:7px 12px;font-size:12px;color:var(--ink);border-radius:3px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer
}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-pos{background:var(--pos);color:var(--paper);border-color:var(--pos)}
.btn-pos:hover{background:#2F5530;border-color:#2F5530}
.btn-neg{background:var(--neg);color:var(--paper);border-color:var(--neg)}
.btn-neg:hover{background:#7E2E25;border-color:#7E2E25}
.btn-info{background:var(--info);color:var(--paper);border-color:var(--info)}
.btn-info:hover{background:#234958;border-color:#234958}
.btn-disabled{opacity:.42;cursor:not-allowed;color:var(--muted)}
.btn-disabled:hover{border-color:var(--line-2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--line-2);background:var(--paper-2)}
.btn-sm{padding:5px 9px;font-size:11.5px}
.btn-lg{padding:9px 14px;font-size:13px;font-weight:500}

/* ─────────── Status pills ─────────── */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.04em;
  padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);background:var(--paper);
  text-transform:uppercase;white-space:nowrap
}
.pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.pill.p-pending{color:var(--warn);border-color:#E2C887;background:var(--warn-soft)}
.pill.p-pending .pdot{background:var(--warn)}
.pill.p-approved{color:var(--pos);border-color:#B2C8A8;background:var(--pos-soft)}
.pill.p-approved .pdot{background:var(--pos)}
.pill.p-rejected{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
.pill.p-rejected .pdot{background:var(--neg)}
.pill.p-sentback{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}
.pill.p-sentback .pdot{background:var(--info)}
.pill.p-locked{color:var(--muted);background:var(--paper-2);border-color:var(--line-2)}
.pill.p-locked .pdot{background:var(--muted-2)}
.pill.p-warn{color:var(--warn);border-color:#E2C887;background:var(--warn-soft)}
.pill.p-warn .pdot{background:var(--warn)}
@keyframes bp{50%{opacity:.3}}

/* ─────────── Kind tags (inline) ─────────── */
.kind-tag{
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.04em;
  padding:1px 5px;border:1px solid var(--line-2);border-radius:2px;
  color:var(--muted-2);text-transform:uppercase;display:inline-block;vertical-align:1px
}
.kind-tag.discount{color:var(--accent-2);border-color:#D9BFA0;background:var(--warn-soft)}
.kind-tag.terms{color:#5C3A1E;border-color:#D9BFA0;background:#F0E2CE}
.kind-tag.legal{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
.kind-tag.commercial{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}

/* ─────────── Context chip ─────────── */
.ctxchip{
  font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.06em;
  border:1px solid var(--line-2);background:var(--paper);padding:0 4px;
  border-radius:2px;color:var(--muted-2);vertical-align:1px;margin-left:4px;display:inline-block
}

/* ─────────── SLA bar ─────────── */
.sla-bar{height:5px;background:var(--paper-2);border:1px solid var(--hairline);position:relative;border-radius:1px;flex-shrink:0}
.sla-bar .fill{position:absolute;top:0;bottom:0;left:0;background:var(--warn)}
.sla-bar .fill.over{background:var(--neg)}
.sla-bar .fill.ok{background:var(--pos)}
.sla-bar .fill.cold{background:var(--info)}
.sla-bar .fill.warn{background:var(--warn)}
.sla-text{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.sla-text.warn{color:var(--accent-2);font-weight:600}
.sla-text.over{color:var(--neg);font-weight:600}
.sla-text.ok{color:var(--pos)}

/* ─────────── Panels ─────────── */
.panel{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--hairline);gap:10px;flex-wrap:wrap
}
.panel-title{
  font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.panel-title em{
  font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--muted);
  font-weight:400;font-size:11px;letter-spacing:.02em;text-transform:none
}
.panel-actions{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.panel-actions a{border-bottom:1px dotted var(--line-2);cursor:pointer}
.panel-actions a:hover{color:var(--ink);border-color:var(--ink)}

/* ─────────── Page content ─────────── */
.content{padding:18px 22px 60px;min-width:0}

/* ─────────── Scenario toggle ─────────── */
.scenario-opt{
  font-size:12px;padding:5px 12px;border-radius:14px;
  color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  background:none;border:0;font:inherit;
}
.scenario-opt.on{background:var(--ink);color:var(--paper)}
.scenario-opt:not(.on):hover{background:var(--paper-3)}

/* ─────────── Request header ─────────── */
.req-header-nav{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-bottom:1px solid var(--hairline);
  background:var(--paper-2);font-size:12px;flex-wrap:wrap
}
.req-header-body{
  padding:16px 18px;
  display:flex;gap:20px;align-items:flex-start;justify-content:space-between
}

/* ─────────── Access box ─────────── */
.accbox{
  background:var(--info-soft);border:1px solid #A4C0C8;border-left:3px solid var(--info);
  padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;
  align-items:start;font-size:12px;color:var(--ink-2)
}
.accbox .mk{
  width:24px;height:24px;border-radius:50%;background:var(--white);border:1px solid var(--info);
  display:grid;place-items:center;color:var(--info);font-family:"JetBrains Mono",monospace;
  font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px
}
.accbox .t{font-weight:600;font-size:12.5px;line-height:1.3}
.accbox .s{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}

/* ─────────── Detail grid ─────────── */
.detail-grid{
  display:grid;
  grid-template-columns:1fr 364px;
  gap:14px;
  align-items:start
}
.detail-left{display:flex;flex-direction:column;min-width:0}
.detail-right{
  position:sticky;top:72px;
  display:flex;flex-direction:column;
  max-height:calc(100vh - 90px);
  overflow-y:auto
}

/* ─────────── Deal snapshot ─────────── */
.snapshot-grid{
  display:grid;grid-template-columns:1fr 1fr;
}
.snap-cell{
  padding:10px 14px;
  border-right:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline);
  min-width:0
}
.snap-cell:nth-child(2n){border-right:0}
.snap-cell:nth-last-child(-n+2){border-bottom:0}
.snap-cell[style*="span 2"]{border-right:0}
.snap-label{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:0;flex-wrap:wrap
}
.snap-value{
  font-size:12.5px;font-weight:500;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35
}

/* ─────────── Request detail blocks ─────────── */
.detail-block{
  padding:12px 14px;
  border-bottom:1px solid var(--hairline);
  display:flex;flex-direction:column;gap:7px
}
.detail-block:last-child{border-bottom:0}
.detail-block-title{
  font-size:12px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap
}
.just-body{
  font-size:12.5px;line-height:1.6;color:var(--ink-2);
  padding:9px 11px;background:var(--paper-2);
  border-left:2px solid var(--line-2);
  text-wrap:pretty
}
.attach-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;background:var(--paper-2);
  border:1px solid var(--hairline);font-size:12px
}

/* ─────────── Approval chain timeline ─────────── */
.chain{display:flex;flex-direction:column}
.chain-step{
  display:grid;grid-template-columns:28px 1fr auto;gap:10px;
  padding:10px 0;position:relative;align-items:start
}
.chain-step::before{
  content:"";position:absolute;left:13px;top:30px;bottom:-10px;
  width:1.5px;background:var(--line-2)
}
.chain-step:last-child::before{display:none}
.chain-mk{
  width:24px;height:24px;border-radius:50%;background:var(--white);
  border:1.5px solid var(--line-2);display:grid;place-items:center;
  font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;color:var(--ink-2);
  position:relative;z-index:2;flex-shrink:0;margin-top:1px
}
.chain-step.cur  .chain-mk{border-color:var(--warn);background:var(--warn-soft);color:var(--accent-2)}
.chain-step.done .chain-mk{border-color:var(--pos);background:var(--pos-soft);color:var(--pos)}
.chain-step.fut  .chain-mk{border-style:dashed;color:var(--muted-2)}
.chain-step.lock .chain-mk{background:var(--paper-2);color:var(--muted-2);border-style:dashed}
.chain-step .nm{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
.chain-step .who{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;letter-spacing:.02em;margin-top:2px}
.chain-step .badge{
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:1px 5px;border:1px solid var(--line-2);background:var(--paper);
  border-radius:2px;white-space:nowrap;align-self:flex-start;margin-top:2px
}
.chain-step.cur  .badge{color:var(--accent-2);background:var(--warn-soft);border-color:#D9BFA0}
.chain-step.done .badge{color:var(--pos);background:var(--pos-soft);border-color:#B2C8A8}
.chain-step.lock .badge{color:var(--muted-2);background:var(--paper-2);border-style:dashed}

/* ─────────── Decision panel ─────────── */
.decision-panel{border:1px solid var(--line)}
.dec-mode-btn{
  display:flex !important;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:13px !important;
  font-weight:500 !important;
  padding:10px 12px !important;
}

/* ─────────── Toast ─────────── */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;font-size:13px;
  display:flex;align-items:center;gap:10px;z-index:100;
  box-shadow:0 10px 28px rgba(20,18,12,.22);
  border:1px solid var(--ink-2);
  animation:toast-in .18s ease both
}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast .ok{color:#9CC58F;font-size:15px}
.toast .err{color:#E0A29A;font-size:15px}

/* ─────────── Footer ─────────── */
.foot-ruler{
  margin-top:24px;border-top:1px solid var(--hairline);padding-top:10px;
  display:flex;justify-content:space-between;color:var(--muted);font-size:11px;
  font-family:"JetBrains Mono",monospace;letter-spacing:.04em;flex-wrap:wrap;gap:8px
}

/* ─────────── Responsive ─────────── */
@media(max-width:1280px){
  .detail-grid{grid-template-columns:1fr 320px}
}
@media(max-width:1100px){
  .detail-grid{grid-template-columns:1fr}
  .detail-right{position:relative;top:auto;max-height:none}
}
@media(max-width:1000px){
  .app{grid-template-columns:64px 1fr}
  .sidebar .brand-name,.sidebar .tenant,.sidebar .nav-count,
  .sidebar .nav-label,.sidebar .user-meta,.sidebar .switch-btn{display:none}
  .sidebar .nav-item{grid-template-columns:1fr;justify-items:center;padding:8px}
  .sidebar .brand{justify-content:center;padding:18px 0}
  .nav-title{display:none}
  .user-block{justify-content:center;padding:12px 0}
  .req-header-body{flex-direction:column}
  .snapshot-grid{grid-template-columns:1fr}
  .snap-cell:nth-child(2n){border-right:0}
  .snap-cell{border-right:0}
}
</style>
