<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sales Ops CRM — Submit Approval</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F1EB; --paper-2:#EEEAE0; --paper-3:#E6E1D4;
    --ink:#17150F; --ink-2:#3A372E; --muted:#6E6A5C; --muted-2:#8C8779;
    --line:#D6D0BF; --line-2:#C4BDA8; --hairline:#E4DFD0;
    --accent:#B57321; --accent-2:#8A5616; --accent-soft:#F2E3C8;
    --pos:#3F6B3A; --pos-soft:#E2EAD6;
    --neg:#9A3A2F; --neg-soft:#F0DAD3;
    --warn:#A36A11; --warn-soft:#F4E3C1;
    --info:#2D5B6B; --info-soft:#D6E1E4;
    --white:#FBFAF6; --select:#FBF1DC;
    font-family:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-feature-settings:"ss01","cv11","tnum";
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
  body{font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-feature-settings:"tnum","ss02"}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit;text-decoration:none}
  input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--accent-soft);color:var(--ink)}

  /* ─── App grid (shell carried from previous prototypes) ─── */
  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
  .sidebar{background:var(--paper-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .main{display:flex;flex-direction:column;min-width:0}

  /* Sidebar */
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px}
  .brand-mark{width:22px;height:22px;flex:0 0 22px;position:relative}
  .brand-mark::before,.brand-mark::after{content:"";position:absolute;inset:0;border:1.5px solid var(--ink)}
  .brand-mark::after{inset:5px;background:var(--accent);border-color:var(--accent-2)}
  .brand-name{font-weight:600;letter-spacing:.02em;font-size:14px}
  .brand-name span{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .tenant{padding:12px 18px;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:4px}
  .tenant-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .tenant-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .tenant-name{font-weight:600;font-size:13.5px}
  .tenant-env{font-family:"JetBrains Mono",monospace;font-size:10px;padding:2px 6px;border:1px solid #D9BFA0;border-radius:2px;color:var(--accent-2);background:var(--warn-soft);letter-spacing:.04em}
  .tenant-meta{display:flex;gap:8px;font-size:11px;color:var(--muted)}
  .tenant-meta .dot{color:var(--line-2)}
  .nav{flex:1;overflow:auto;padding:10px 0 12px}
  .nav-section{margin-top:14px}
  .nav-section:first-child{margin-top:8px}
  .nav-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);padding:6px 18px 4px;display:flex;justify-content:space-between;align-items:center}
  .nav-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--line-2);letter-spacing:.05em}
  .nav-item{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:7px 18px 7px 14px;border-left:2px solid transparent;color:var(--ink-2);font-size:13px;cursor:pointer;position:relative}
  .nav-item:hover{background:var(--paper-3);color:var(--ink)}
  .nav-item.active{background:var(--paper-3);border-left-color:var(--accent);color:var(--ink);font-weight:500}
  .nav-mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--white);font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
  .nav-item.active .nav-mark{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
  .nav-count{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);min-width:18px;text-align:right}
  .nav-count.alert{color:var(--accent-2);font-weight:600}
  .nav-item.disabled{opacity:.35;pointer-events:none}
  .nav-label{display:flex;align-items:baseline}
  .user-block{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--paper-2)}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.04em;flex:0 0 30px;border:1px solid var(--ink)}
  .avatar.bg-c{background:#2A4655;border-color:#2A4655}
  .avatar.bg-b{background:#5C3A1E;border-color:#5C3A1E}
  .avatar.bg-a{background:#2D3E2C;border-color:#2D3E2C}
  .avatar.bg-d{background:#6B2E2E;border-color:#6B2E2E}
  .user-meta{display:flex;flex-direction:column;min-width:0;flex:1}
  .user-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch-btn{border:1px solid var(--line-2);padding:5px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--paper);border-radius:2px;font-family:"JetBrains Mono",monospace}
  .switch-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* Top bar */
  .topbar{height:56px;border-bottom:1px solid var(--line);background:var(--paper);display:grid;grid-template-columns:1fr minmax(280px,440px) auto;align-items:center;gap:20px;padding:0 22px;position:sticky;top:0;z-index:5}
  .crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .crumb strong{color:var(--ink);font-weight:600;font-size:13.5px}
  .crumb .sep{color:var(--line-2)}
  .crumb .pulse{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--accent-2);padding:3px 7px;border:1px solid #D9BFA0;border-radius:2px;background:var(--warn-soft);letter-spacing:.04em}
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .search{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:12.5px;color:var(--muted)}
  .search:focus-within{border-color:var(--ink);background:var(--white)}
  .search svg{flex:0 0 14px;color:var(--muted)}
  .search input{border:0;background:transparent;outline:none;flex:1;font:inherit;color:var(--ink)}
  .search kbd{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:2px;padding:1px 5px;background:var(--paper)}
  .top-actions{display:flex;align-items:center;gap:10px}
  .icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink-2);position:relative}
  .icon-btn:hover{border-color:var(--ink);color:var(--ink)}
  .icon-btn .dot-badge{position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;padding:0 3px;background:var(--accent);color:var(--white);font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:600;border-radius:7px;display:grid;place-items:center;border:1.5px solid var(--paper)}
  .role-pill{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
  .role-pill:hover{border-color:var(--ink)}
  .role-pill .avatar{width:26px;height:26px;flex:0 0 26px;font-size:10px}
  .role-pill .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .role-pill .who b{font-size:12px;font-weight:600}
  .role-pill .who span{font-size:10.5px;color:var(--muted)}
  .role-pill .chev{color:var(--muted);margin-left:2px}

  /* ─── Page ─── */
  .content{padding:18px 24px 60px;max-width:1440px}

  /* Buttons */
  .btn{border:1px solid var(--line-2);background:var(--paper);padding:7px 12px;font-size:12px;color:var(--ink);border-radius:3px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--ink)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn-disabled{opacity:.45;cursor:not-allowed;color:var(--muted)}
  .btn-disabled:hover{border-color:var(--line-2)}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--line-2)}
  .btn .kbd{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted)}
  .btn-primary .kbd{color:var(--paper-3)}
  .btn-sm{padding:5px 9px;font-size:11.5px}
  .btn-warn{border-color:#D9BFA0;background:var(--warn-soft);color:var(--accent-2)}
  .btn-warn:hover{border-color:var(--accent);color:var(--accent-2)}

  /* Pills */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.04em;padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);background:var(--paper);text-transform:uppercase}
  .pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .pill.p-pending{color:var(--warn);border-color:#E2C887;background:var(--warn-soft)}
  .pill.p-pending .pdot{background:var(--warn)}
  .pill.p-approved{color:var(--pos);border-color:#B2C8A8;background:var(--pos-soft)}
  .pill.p-approved .pdot{background:var(--pos)}
  .pill.p-rejected{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
  .pill.p-rejected .pdot{background:var(--neg)}
  .pill.p-sentback{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}
  .pill.p-sentback .pdot{background:var(--info)}
  .pill.p-none{color:var(--muted)}
  .pill.p-running{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}
  .pill.p-running .pdot{background:var(--info);animation:bp 1.6s infinite}
  .pill.p-draft{color:var(--ink-2);border-color:var(--line-2);background:var(--paper-2)}
  .pill.p-ready{color:var(--pos);border-color:#B2C8A8;background:var(--pos-soft)}
  .pill.p-ready .pdot{background:var(--pos)}
  .pill.p-blocked{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
  .pill.p-blocked .pdot{background:var(--neg)}
  @keyframes bp{50%{opacity:.3}}

  /* ─── Page head ─── */
  .page-head{
    display:grid;grid-template-columns:1fr auto;gap:18px;align-items:flex-end;
    padding-bottom:14px;border-bottom:1px solid var(--hairline);margin-bottom:14px;
  }
  .page-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .page-title em{font-style:normal;color:var(--muted);font-weight:400;font-size:16px;margin-left:6px}
  .page-sub{display:flex;gap:10px;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
  .page-sub .mono{color:var(--ink-2)}
  .page-sub .sep{color:var(--line-2)}
  .page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

  /* Scenario toggle */
  .scenario{
    display:inline-flex;align-items:center;gap:0;background:var(--paper-2);
    border:1px solid var(--line-2);border-radius:18px;padding:3px;
    margin-right:6px;
  }
  .scenario-label{
    font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    padding:0 10px 0 6px;border-right:1px solid var(--line-2);height:24px;display:inline-flex;align-items:center;
  }
  .scenario-opt{
    font-size:11.5px;padding:5px 11px;border-radius:14px;color:var(--ink-2);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .scenario-opt.on{background:var(--ink);color:var(--paper)}
  .scenario-opt .mono{font-size:10px;color:var(--muted)}
  .scenario-opt.on .mono{color:var(--paper-3)}

  /* ─── Process strip (linear progress 1..2..3) ─── */
  .process{
    background:var(--white);border:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:14px;
  }
  .process-step{
    padding:12px 14px 12px 22px;border-right:1px solid var(--hairline);position:relative;min-width:0;
  }
  .process-step:last-child{border-right:0}
  .process-step::before{
    content:"";position:absolute;top:0;right:-14px;width:28px;height:100%;
    background:inherit;clip-path:polygon(0 0, 50% 50%, 0 100%);
    z-index:2;border-right:1px solid var(--hairline);
  }
  .process-step::after{
    content:"";position:absolute;top:0;left:0;width:14px;height:100%;
    background:var(--white);clip-path:polygon(0 0, 100% 50%, 0 100%);z-index:1;
  }
  .process-step:first-child{padding-left:14px}
  .process-step:first-child::after{display:none}
  .process-step:last-child::before{display:none}
  .process-step.done{background:var(--paper-2)} .process-step.done::after{background:var(--paper-2)} .process-step.done::before{background:var(--paper-2)}
  .process-step.cur{background:var(--accent-soft)} .process-step.cur::after{background:var(--accent-soft)} .process-step.cur::before{background:var(--accent-soft)}
  .process-step.fut{background:var(--white)}
  .ps-num{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);position:relative;z-index:3;display:flex;align-items:center;gap:6px}
  .process-step.cur .ps-num{color:var(--accent-2)}
  .ps-num .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
  .process-step.done .ps-num .dot{background:var(--pos)}
  .process-step.cur .ps-num .dot{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);animation:bp 1.6s infinite}
  .process-step.fut .ps-num{color:var(--muted-2)}
  .ps-label{font-size:13px;font-weight:500;margin-top:4px;position:relative;z-index:3}
  .process-step.fut .ps-label{color:var(--muted)}
  .ps-foot{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.04em;position:relative;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .process-step.cur .ps-foot{color:var(--accent-2)}
  .process-step.done .ps-foot{color:var(--pos)}

  /* ─── Workspace 2-col ─── */
  .work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:flex-start}

  /* Panel */
  .panel{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .panel + .panel{margin-top:14px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--hairline);gap:10px}
  .panel-title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
  .panel-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.02em;text-transform:none}
  .panel-actions{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
  .panel-actions a{border-bottom:1px dotted var(--line-2);cursor:pointer}
  .panel-actions a:hover{color:var(--ink);border-color:var(--ink)}

  /* Snapshot grid */
  .snap{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;
  }
  .snap-cell{padding:9px 14px;border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);min-width:0}
  .snap-cell:nth-child(5n){border-right:0}
  .snap-cell:nth-last-child(-n+5){border-bottom:0}
  .snap-l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:6px}
  .snap-v{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .snap-v small{color:var(--muted);font-weight:400;font-size:11.5px}
  .snap-v.num{font-family:"JetBrains Mono",monospace;font-size:14.5px}
  .snap-foot{padding:8px 14px;background:var(--paper-2);font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;font-family:"JetBrains Mono",monospace;letter-spacing:.02em;border-top:1px solid var(--hairline)}
  .snap-foot .l{color:var(--muted-2);text-transform:uppercase;letter-spacing:.1em;font-size:10px}

  /* Request type segmented cards */
  .types{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;
  }
  .type-card{
    padding:12px 14px;border-right:1px solid var(--hairline);cursor:pointer;
    position:relative;background:var(--white);min-width:0;
  }
  .type-card:last-child{border-right:0}
  .type-card:hover{background:var(--paper-2)}
  .type-card.on{background:var(--accent-soft);outline:1.5px solid var(--accent);outline-offset:-1.5px;z-index:2}
  .type-card-l{display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .type-card.on .type-card-l{color:var(--accent-2)}
  .type-card-l .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--white)}
  .type-card.on .type-card-l .dot{background:var(--accent);border-color:var(--accent-2)}
  .type-card-nm{font-size:13.5px;font-weight:600;margin-top:6px;letter-spacing:-.005em}
  .type-card.on .type-card-nm{color:var(--ink)}
  .type-card-ds{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}

  /* Form grid */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .form-field{
    padding:10px 14px;border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
    min-width:0;display:flex;flex-direction:column;gap:5px;
  }
  .form-field.full{grid-column:1/-1;border-right:0}
  .form-field:nth-child(2n){border-right:0}
  .form-field:nth-last-child(-n+2){border-bottom:0}
  .form-field.full:last-child{border-bottom:0}
  .form-field.err{background:#FBEFE8}
  .form-field label{font-size:11px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .form-field label .req{color:var(--accent-2);font-family:"JetBrains Mono",monospace;font-size:10px}
  .form-field label .tag-req{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.06em;border:1px solid #D6B0A8;background:var(--neg-soft);color:var(--neg);padding:0 4px;border-radius:2px;text-transform:uppercase}
  .form-field label .tag-pol{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.06em;border:1px solid #D9BFA0;background:var(--warn-soft);color:var(--accent-2);padding:0 4px;border-radius:2px;text-transform:uppercase}
  .form-field .ctl{
    display:flex;align-items:center;gap:8px;background:var(--white);
    border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:13px;
  }
  .form-field .ctl:focus-within{border-color:var(--ink)}
  .form-field.err .ctl{border-color:var(--neg)}
  .form-field input,.form-field select,.form-field textarea{border:0;background:transparent;outline:none;width:100%;font:inherit;color:var(--ink);appearance:none}
  .form-field textarea{resize:vertical;min-height:60px;line-height:1.5}
  .form-field .ctl .chev{color:var(--muted)}
  .form-field .ctl .pre{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:11.5px}
  .form-field .hint{font-size:10.5px;color:var(--muted);font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
  .form-field .err-msg{font-size:11px;color:var(--neg);display:flex;align-items:center;gap:6px}
  .form-field .err-msg .x{
    width:12px;height:12px;display:grid;place-items:center;border:1.5px solid var(--neg);border-radius:50%;
    color:var(--neg);font-size:8px;font-weight:600;flex-shrink:0;
  }

  /* Urgency radio row */
  .urgency-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--white);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .urgency-opt{
    padding:7px 10px;border-right:1px solid var(--hairline);cursor:pointer;
    display:flex;align-items:center;gap:8px;font-size:12px;
  }
  .urgency-opt:last-child{border-right:0}
  .urgency-opt:hover{background:var(--paper-2)}
  .urgency-opt.on{background:var(--accent-soft);color:var(--ink-2);font-weight:500}
  .urgency-opt .ix{
    width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--white);
    flex-shrink:0;display:grid;place-items:center;
  }
  .urgency-opt.on .ix{border-color:var(--accent-2)}
  .urgency-opt.on .ix::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
  .urgency-opt .lbl{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;color:var(--muted);margin-left:auto}
  .urgency-opt.on .lbl{color:var(--accent-2)}

  /* Attachments placeholder */
  .attach{
    border:1px dashed var(--line-2);background:var(--paper-2);
    padding:12px 14px;border-radius:3px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  }
  .attach .ic{
    width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--white);
    font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;color:var(--muted-2);
  }
  .attach .t{font-size:12.5px;font-weight:500}
  .attach .s{font-size:11px;color:var(--muted);margin-top:2px;font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
  .attach-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .attach-item{
    display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;
    padding:5px 10px;background:var(--white);border:1px solid var(--hairline);font-size:12px;
  }
  .attach-item .nm{font-weight:500}
  .attach-item .sz{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .attach-item .x{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11px;cursor:pointer;padding:0 4px}
  .attach-item .x:hover{color:var(--neg)}

  /* Form foot bar */
  .form-foot{
    padding:12px 14px;background:var(--paper-2);border-top:1px solid var(--hairline);
    display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
  }
  .form-foot .summary{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .form-foot .summary .mono{color:var(--ink-2)}
  .form-foot .sep{color:var(--line-2)}
  .form-foot .actions{display:flex;gap:8px;align-items:center}

  /* Validation banner inside form */
  .v-banner{
    padding:11px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    border-top:1px solid var(--hairline);
  }
  .v-banner.err{background:#FBEFE8;border-left:3px solid var(--neg)}
  .v-banner.ok{background:var(--pos-soft);border-left:3px solid var(--pos)}
  .v-banner-mark{
    width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
    background:var(--white);border:1.5px solid var(--line-2);
    font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;
  }
  .v-banner.err .v-banner-mark{border-color:var(--neg);color:var(--neg)}
  .v-banner.ok  .v-banner-mark{border-color:var(--pos);color:var(--pos)}
  .v-banner-body .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .v-banner-body .s{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}
  .v-banner-body .s .mono{color:var(--ink-2)}

  /* Right column: Policy preview */
  .policy-banner{
    padding:12px 14px;background:var(--warn-soft);border-bottom:1px solid #E2C887;
    display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;
  }
  .policy-mark{
    width:34px;height:34px;border-radius:50%;background:var(--white);border:1.5px solid var(--warn);
    display:grid;place-items:center;color:var(--accent-2);
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;
  }
  .policy-banner .l{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
  .policy-banner .v{font-size:13.5px;font-weight:600;margin-top:1px}
  .policy-banner .v small{font-family:"JetBrains Mono",monospace;color:var(--accent-2);font-weight:400;font-size:11px;margin-left:6px}

  .pol-rules{display:flex;flex-direction:column}
  .pol-rule{
    display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
    padding:9px 14px;border-bottom:1px solid var(--hairline);
  }
  .pol-rule:last-child{border-bottom:0}
  .pol-rule .ix{
    width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--paper);
    font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--muted);font-weight:600;
  }
  .pol-rule.match .ix{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
  .pol-rule .body .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .pol-rule .body .v{font-size:12.5px;font-weight:500;margin-top:1px}
  .pol-rule .body .v .mono{font-weight:500}
  .pol-rule .res{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--pos);text-transform:uppercase}
  .pol-rule.miss .res{color:var(--muted)}

  .pol-explain{
    padding:12px 14px;background:var(--paper-2);border-top:1px solid var(--hairline);
    font-size:12.5px;line-height:1.5;color:var(--ink-2);
  }
  .pol-explain .h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .pol-explain p{margin:0}
  .pol-explain p + p{margin-top:8px}

  /* Approval chain preview */
  .chain{padding:0}
  .chain-step{
    display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:flex-start;
    padding:11px 14px;border-bottom:1px solid var(--hairline);position:relative;
  }
  .chain-step:last-child{border-bottom:0}
  .chain-step::before{
    content:"";position:absolute;left:32px;top:32px;bottom:-1px;width:1.5px;background:var(--line-2);
  }
  .chain-step:last-child::before{display:none}
  .chain-mark{
    width:28px;height:28px;border-radius:50%;background:var(--white);border:1.5px solid var(--line-2);
    display:grid;place-items:center;color:var(--ink-2);
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;position:relative;z-index:2;
  }
  .chain-step.cur .chain-mark{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
  .chain-step.fut .chain-mark{border-style:dashed;color:var(--muted-2)}
  .chain-step.done .chain-mark{border-color:var(--pos);background:var(--pos-soft);color:var(--pos)}
  .chain-step .body{min-width:0}
  .chain-step .nm{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chain-step .who{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
  .chain-step .sla{font-size:11px;color:var(--muted);margin-top:3px}
  .chain-step.fut .nm,.chain-step.fut .who{color:var(--muted)}
  .chain-step.fut .nm{color:var(--ink-2);font-weight:500}
  .chain-step .badge{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:1px 5px;border:1px solid var(--line-2);background:var(--paper);border-radius:2px;align-self:flex-start;white-space:nowrap}
  .chain-step.cur .badge{color:var(--accent-2);background:var(--warn-soft);border-color:#D9BFA0}
  .chain-step.done .badge{color:var(--pos);background:var(--pos-soft);border-color:#B2C8A8}

  .chain-rule{
    padding:10px 14px;background:var(--paper-2);border-top:1px solid var(--hairline);font-size:11.5px;color:var(--ink-2);
    display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:flex-start;line-height:1.45;
  }
  .chain-rule .mono{color:var(--ink-2)}
  .chain-rule .mk{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--accent-2);letter-spacing:.1em;background:var(--warn-soft);border:1px solid #D9BFA0;padding:1px 5px;border-radius:2px;text-transform:uppercase}

  /* Lifecycle impact */
  .life{padding:0}
  .life-row{
    display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:flex-start;
    padding:10px 14px;border-bottom:1px solid var(--hairline);
  }
  .life-row:last-child{border-bottom:0}
  .life-mk{
    width:20px;height:20px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;
    font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--muted);font-weight:600;border-radius:50%;
  }
  .life-row.lock .life-mk{background:var(--warn-soft);border-color:var(--warn);color:var(--accent-2)}
  .life-row.audit .life-mk{background:var(--info-soft);border-color:var(--info);color:var(--info)}
  .life-row .nm{font-size:12.5px;font-weight:500;line-height:1.4}
  .life-row .ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .life-row .tg{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:flex-start;white-space:nowrap}

  /* ─── Submitted success state ─── */
  .success-card{
    background:var(--white);border:1px solid var(--line);
    padding:30px 32px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;
    margin-bottom:14px;border-left:4px solid var(--pos);
  }
  .success-mark{
    width:54px;height:54px;border-radius:50%;border:2px solid var(--pos);
    display:grid;place-items:center;color:var(--pos);background:var(--pos-soft);font-size:24px;
  }
  .success-body .l{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pos)}
  .success-body .t{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-top:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .success-body .t .reqid{font-family:"JetBrains Mono",monospace;font-size:14px;background:var(--accent-soft);color:var(--accent-2);padding:3px 9px;border-radius:2px;font-weight:600;letter-spacing:.04em}
  .success-body .ds{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.5;max-width:640px}
  .success-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

  .submitted-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--hairline);margin-top:18px}
  .submitted-cell{padding:10px 14px;border-right:1px solid var(--hairline);min-width:0}
  .submitted-cell:last-child{border-right:0}
  .submitted-cell .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .submitted-cell .v{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .submitted-cell .v .mono{font-weight:500}

  /* Blocked state card */
  .blocked-card{
    background:#FBEFE8;border:1px solid var(--neg);border-left:4px solid var(--neg);
    padding:18px 22px;margin-bottom:14px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  }
  .blocked-mark{
    width:46px;height:46px;border-radius:50%;background:var(--neg-soft);border:2px solid var(--neg);
    display:grid;place-items:center;color:var(--neg);font-size:22px;
  }
  .blocked-body .l{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--neg)}
  .blocked-body .t{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
  .blocked-body .ds{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
  .blocked-body .ds .mono{color:var(--ink-2)}
  .blocked-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .blocked-detail{
    padding:0;background:var(--white);border:1px solid var(--line);margin-bottom:14px;
  }
  .blocked-detail .row{
    display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;
    padding:9px 14px;border-bottom:1px solid var(--hairline);
  }
  .blocked-detail .row:last-child{border-bottom:0}
  .blocked-detail .row .l{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .blocked-detail .row .v{font-size:12.5px;font-weight:500}
  .blocked-detail .row .v .mono{color:var(--ink-2)}

  /* Toast */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;font-size:12.5px;border-radius:3px;display:flex;align-items:center;gap:10px;z-index:70;box-shadow:0 10px 24px rgba(20,18,12,.2)}
  .toast .ok{color:#9CC58F}

  /* Foot ruler */
  .foot-ruler{margin-top:18px;border-top:1px solid var(--hairline);padding-top:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.04em;flex-wrap:wrap;gap:10px}

  /* Tablet */
  @media (max-width:1180px){
    .work{grid-template-columns:1fr}
    .snap{grid-template-columns:repeat(3,1fr)}
    .types{grid-template-columns:repeat(2,1fr)}
    .process{grid-template-columns:repeat(2,1fr)}
    .submitted-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:980px){
    .app{grid-template-columns:64px 1fr}
    .sidebar .brand-name,.sidebar .tenant,.sidebar .nav-count,.sidebar .nav-label,.sidebar .user-meta,.sidebar .switch-btn{display:none}
    .sidebar .nav-item{grid-template-columns:1fr;justify-items:center;padding:8px}
    .sidebar .brand{justify-content:center;padding:18px 0}
    .nav-title{display:none}
    .user-block{justify-content:center;padding:12px 0}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ─────────── Static ─────────── */

const ANNA = { name:"Anna Petrova", role:"Sales Representative", initials:"AP", color:"bg-c", roleCode:"REP" };

const MODULES = [
  { key:"dashboard",  code:"DA", label:"Dashboard",      section:"workspace", count:null },
  { key:"accounts",   code:"AC", label:"Accounts",       section:"workspace", count:412 },
  { key:"contacts",   code:"CO", label:"Contacts",       section:"workspace", count:1843 },
  { key:"opps",       code:"OP", label:"Opportunities",  section:"workspace", count:12 },
  { key:"approvals",  code:"AP", label:"Approvals",      section:"governance",count:3, alert:true },
  { key:"imports",    code:"IM", label:"Imports",        section:"data",      disabled:true },
  { key:"duplicates", code:"DU", label:"Duplicates",     section:"data",      disabled:true },
  { key:"metadata",   code:"MA", label:"Metadata Admin", section:"data",      disabled:true },
  { key:"reports",    code:"RE", label:"Reports",        section:"insights",  disabled:true },
  { key:"audit",      code:"AU", label:"Audit",          section:"insights",  disabled:true },
];
const SECTIONS = [
  { key:"workspace",  label:"Workspace",   index:"01" },
  { key:"governance", label:"Governance",  index:"02" },
  { key:"data",       label:"Data & Quality", index:"03" },
  { key:"insights",   label:"Insights",    index:"04" },
];

/* The opportunity context */
const OPP = {
  id:"OPP-2418",
  title:"Q3 Equipment Renewal",
  account:{ id:"AC-3318", name:"Acme Manufacturing" },
  contact:{ id:"CT-7421", name:"Taylor Brooks", role:"VP Operations" },
  owner:{ name:"Anna Petrova", initials:"AP" },
  amount:145000,
  stage:"Proposal",
  close:"2026-06-28",
  currentDiscount:4,
  region:"DACH-North",
  paymentRisk:"Medium",
};

/* Request types */
const TYPES = [
  { key:"discount",  code:"DSC", name:"Discount Exception",        desc:"Pricing discount above the auto-approved threshold.", policy:"DISCOUNT-A" },
  { key:"terms",     code:"PMT", name:"Payment Terms Exception",   desc:"Non-standard payment terms (e.g. NET-60, NET-90).",   policy:"TERMS-B" },

  { key:"commercial",code:"COM", name:"Commercial Exception",      desc:"Non-standard SLA, scope or bundled commercial terms.",policy:"COMMERCIAL-D" },
];

/* ─────────── Helpers ─────────── */
function fmtMoney(n){
  return "$" + n.toLocaleString();
}
function Pill({ kind, children }){
  return <span className={`pill p-${kind}`}><span className="pdot" />{children}</span>;
}

/* ─────────── Sidebar / Topbar ─────────── */

function BrandMark(){ return <span className="brand-mark" aria-hidden /> }

function Sidebar(){
  return (
    <aside className="sidebar">
      <div className="brand">
        <BrandMark />
        <div className="brand-name">Sales Ops CRM<span>v2.4</span></div>
      </div>
      <div className="tenant">
        <div className="tenant-label">Tenant</div>

          <div className="tenant-name">Orion Industrial</div>
          <div className="tenant-env mono">LOCAL PILOT</div>

        <div className="tenant-meta">
          <span className="mono">EU-CENTRAL-1</span>
          <span className="dot">·</span>
          <span>184 seats</span>
        </div>
      </div>

      <nav className="nav">
        {SECTIONS.map(sec=>{
          const items = MODULES.filter(m=>m.section===sec.key);
          return (
            <div key={sec.key} className="nav-section">
              <div className="nav-title">{sec.label}<em>{sec.index}</em></div>
              {items.map(m=>(
                <div
                  key={m.key}
                  className={`nav-item ${m.key==="approvals"?"active":""} ${m.disabled?"disabled":""}`}

                  <span className="nav-mark mono">{m.code}</span>
                  <span className="nav-label">{m.label}</span>

      <div className="user-block">
        <div className={`avatar ${ANNA.color}`}>{ANNA.initials}</div>

          <div className="user-role">{ANNA.role}</div>
        </div>
        <button className="switch-btn">Switch</button>
      </div>
    </aside>
  );

function TopBar(){
  return (
    <div className="topbar">
      <div className="crumb">
        <span className="pulse"><span className="pulse-dot" /> LOCAL PILOT</span>
        <span>Orion Industrial</span>
        <span className="sep">/</span>
        <span>Opportunities</span>
        <span className="sep">/</span>
        <span className="mono" style={{color:"var(--ink-2)"}}>OPP-2418</span>
        <span className="sep">/</span>
        <strong>Submit approval</strong>
      </div>

      <label className="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        <input placeholder="Search accounts, opportunities, contacts, activities…" />
        <kbd>⌘K</kbd>
      </label>

      <div className="top-actions">
        <button className="icon-btn" aria-label="Notifications" title="Notifications">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M3.5 12h9l-1-1.5V7a3.5 3.5 0 0 0-7 0v3.5L3.5 12Z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>
          <span className="dot-badge mono">4</span>
        </button>
        <button className="role-pill">
          <span className={`avatar ${ANNA.color}`}>{ANNA.initials}</span>
          <span className="who">
            <b>Anna P.</b>
            <span>{ANNA.role}</span>
          </span>
          <span className="chev">▾</span>

      match: termsNonStd },

        <div>
          <div className="l">Policy</div>
          <div className="v">Discount Governance v18<small>· DISCOUNT-A</small></div>
        </div>
      </div>

      <div className="pol-rules">
        {rules.map((r,i)=>(
          <div key={i} className={`pol-rule ${r.match?"match":"miss"}`}>
            <div className="ix mono">{r.ix}</div>
            <div className="body">
              <div className="l">{r.l}</div>
              <div className="v">{r.v}</div>

            <div className="res">{r.match ? "MATCH" : "n/a"}</div>

        <div className="h"><span>Why is approval required?</span><span className="mono" style={{color:"var(--muted-2)"}}>plain language</span></div>
        <p>
          Anna requested an <strong>8% discount</strong>, which is above the auto-approved <span className="mono">6%</span> threshold for renewals.

    </section>
  );

}

/* ─────────── Page head + scenario toggle ─────────── */

function PageHead({ scenario, setScenario, stepLabel, stateLabel, stateKind, hasSubmitted }){
  return (
    <div className="page-head">
      <div>
        <h1 className="page-title">
          Submit approval request
          <em>· {OPP.title} <span className="mono" style={{fontSize:13,color:"var(--ink-2)"}}>{OPP.id}</span></em>

/* ─────────── Process strip ─────────── */

function ProcessStrip({ phase }){
  // phase: "draft" | "validated" | "submitted"
  const stage = (k) => {
    const order = ["draft","validate","submit","decision"];
    if(phase === "submitted") return order.indexOf(k) < 3 ? "done" : (k==="decision" ? "cur" : "done");
    if(phase === "validated") return k==="draft" ? "done" : k==="validate" ? "cur" : "fut";
    /* draft */
    return k==="draft" ? "cur" : "fut";
  };
  return (
    <div className="process">
      <div className={`process-step ${stage("draft")}`}>
        <div className="ps-num mono"><span className="dot" />01 · DRAFT</div>
        <div className="ps-label">Fill request form</div>
        <div className="ps-foot">type · narrative · attachments</div>
      </div>
      <div className={`process-step ${stage("validate")}`}>
        <div className="ps-num mono"><span className="dot" />02 · VALIDATE</div>
        <div className="ps-label">Resolve policy & required fields</div>
        <div className="ps-foot">policy DISCOUNT-A · chain preview</div>
      </div>
      <div className={`process-step ${stage("submit")}`}>
        <div className="ps-num mono"><span className="dot" />03 · SUBMIT</div>
        <div className="ps-label">Snapshot + route to Finance</div>
        <div className="ps-foot">REQ-id assigned · audit written</div>
      </div>
      <div className={`process-step ${stage("decision")}`}>
        <div className="ps-num mono"><span className="dot" />04 · DECISION</div>
        <div className="ps-label">Approve · reject · send back</div>
        <div className="ps-foot">applied to OPP-2418 · history kept</div>
      </div>
    </div>
  );
}

/* ─────────── App ─────────── */

function App(){
  const [scenario, setScenario] = useState("normal"); // normal | blocked
  const [type, setType] = useState("discount");

  /* Pre-fill defaults representative of the brief (Discount 8%, NET-45) */
  const initialForm = {
    discount:"8",
    terms:"NET-45",
    justification:"",  // intentionally empty so the validation-error state is reachable
    urgency:"high",
    notes:"Strategic renewal account; we cannot let competitor win this on price.",
    customerImpact:"Customer signaled they would re-evaluate vendor if pricing is not adjusted. Renewal of $145K at risk and downstream service uplift of ~$60K becomes blocked.",
    competition:"",
  };
  const [form, setForm] = useState(initialForm);
  const [validated, setValidated] = useState(null); // null | "err" | "ok"
  const [errors, setErrors] = useState({});
  const [phase, setPhase] = useState("draft");      // draft | validated | submitted
  const [toast, setToast] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  function flashToast(text){
    setToast(text);
    setTimeout(()=>setToast(null), 2800);
  }

  function runValidate(){
    const e = {};
    const d = parseFloat(form.discount);
    if(!form.discount || isNaN(d)) e.discount = "Enter a discount percentage. Use a number (e.g. 8).";
    else if(d > 25) e.discount = "Discount above 25% requires Executive approval — not supported via this form.";
    if(!form.justification || form.justification.trim().length < 40) e.justification = "Provide at least 40 characters of business justification — approvers cannot review an empty case.";
    if(!form.urgency) e.urgency = "Select an urgency level — this sets the approver SLA.";
    if(!form.customerImpact || form.customerImpact.trim().length < 20) e.customerImpact = "Describe what happens to the customer relationship if the exception is not granted.";
    if(!form.competition || form.competition.trim().length < 20) e.competition = "Name the competitor and the offer or pressure. ‘N/A’ is not accepted by policy DISCOUNT-A.";
    setErrors(e);
    const ok = Object.keys(e).length === 0;
    setValidated(ok ? "ok" : "err");
    setPhase(ok ? "validated" : "draft");
    flashToast(ok ? "Validation passed · policy DISCOUNT-A resolved" : `Validation found ${Object.keys(e).length} issue${Object.keys(e).length===1?"":"s"} to fix`);
  }

  function runSubmit(){
    setSubmitted(true);
    setPhase("submitted");
    flashToast("Approval request REQ-1182 submitted · routed to Finance · Daria Smirnova");
  }

  /* Header state pill */
  let stepLabel, stateLabel, stateKind;
  if(scenario === "blocked"){
    stepLabel = "submission · blocked"; stateLabel = "Blocked"; stateKind = "blocked";
  } else if(submitted){
    stepLabel = "submitted · pending finance"; stateLabel = "Pending"; stateKind = "pending";
  } else if(validated === "ok"){
    stepLabel = "ready to submit"; stateLabel = "Ready"; stateKind = "ready";
  } else if(validated === "err"){
    stepLabel = "validation errors"; stateLabel = "Validation errors"; stateKind = "blocked";
  } else {
    stepLabel = "step 01 · draft request"; stateLabel = "Draft"; stateKind = "draft";
  }

  return (
    <div className="app" data-screen-label="04 Submit Approval">
      <Sidebar />
      <div className="main">
        <TopBar />

        <div className="content" data-screen-label="04 Submit Approval Flow">
          <PageHead
            scenario={scenario}
            setScenario={(s)=>{ setScenario(s); if(s==="normal"){ setSubmitted(false); setPhase("draft"); setValidated(null); setErrors({}); setForm(initialForm); } }}
            stepLabel={stepLabel}
            stateLabel={stateLabel}
            stateKind={stateKind}
            hasSubmitted={submitted}
          />

          {scenario === "blocked" ? (
            <BlockedView onSwitchScenario={()=>{ setScenario("normal"); setSubmitted(false); setPhase("draft"); setValidated(null); setForm(initialForm); }} />
          ) : submitted ? (
            <>
              <ProcessStrip phase="submitted" />
              <Snapshot form={form} />
              <div style={{height:14}} />
              <SubmittedView form={form} onBack={()=>flashToast("Would navigate back to OPP-2418 detail")} />
            </>
          ) : (
            <>
              <ProcessStrip phase={phase} />
              <Snapshot form={form} />
              <div style={{height:14}} />
              <div className="work">
                <div>
                  <TypeSelect value={type} onChange={setType} />
                  <RequestForm
                    type={type}
                    form={form}
                    setForm={(updater)=>{ setForm(updater); setValidated(null); }}
                    errors={errors}
                    validated={validated}
                    onValidate={runValidate}
                    onSubmit={runSubmit}
                    canSubmit={validated === "ok"}
                  />
                </div>
                <div>
                  <PolicyPanel form={form} type={type} />
                  <ChainPanel form={form} />
                  <LifecyclePanel />
                </div>
              </div>
            </>
          )}

          <div className="foot-ruler">
            <span>SALES OPS CRM · ORION INDUSTRIAL · LOCAL PILOT</span>
            <span>OPP-2418 · OWNER AP · ROLE REP</span>
            <span>POLICY DISCOUNT-A v18 · METADATA v42 · SHELL v2.4</span>
          </div>
        </div>
      </div>

      {toast && (
        <div className="toast"><span className="ok">✓</span>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
