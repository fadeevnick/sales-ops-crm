<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sales Ops CRM — Sales Rep Workspace</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F1EB;
    --paper-2:#EEEAE0;
    --paper-3:#E6E1D4;
    --ink:#17150F;
    --ink-2:#3A372E;
    --muted:#6E6A5C;
    --muted-2:#8C8779;
    --line:#D6D0BF;
    --line-2:#C4BDA8;
    --hairline:#E4DFD0;
    --accent:#B57321;
    --accent-2:#8A5616;
    --accent-soft:#F2E3C8;
    --pos:#3F6B3A;
    --pos-soft:#E2EAD6;
    --neg:#9A3A2F;
    --neg-soft:#F0DAD3;
    --warn:#A36A11;
    --warn-soft:#F4E3C1;
    --info:#2D5B6B;
    --info-soft:#D6E1E4;
    --white:#FBFAF6;
    --select:#FBF1DC;
    font-family:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-feature-settings:"ss01","cv11","tnum";
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-feature-settings:"tnum","ss02";}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit;text-decoration:none}
  input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--accent-soft);color:var(--ink)}

  /* App grid */
  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
  .sidebar{background:var(--paper-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .main{display:flex;flex-direction:column;min-width:0}

  /* Sidebar */
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px}
  .brand-mark{width:22px;height:22px;flex:0 0 22px;position:relative}
  .brand-mark::before,.brand-mark::after{content:"";position:absolute;inset:0;border:1.5px solid var(--ink)}
  .brand-mark::after{inset:5px;background:var(--accent);border-color:var(--accent-2)}
  .brand-name{font-weight:600;letter-spacing:.02em;font-size:14px}
  .brand-name span{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .tenant{padding:12px 18px;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:4px}
  .tenant-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .tenant-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .tenant-name{font-weight:600;font-size:13.5px}
  .tenant-env{font-family:"JetBrains Mono",monospace;font-size:10px;padding:2px 6px;border:1px solid #D9BFA0;border-radius:2px;color:var(--accent-2);background:var(--warn-soft);letter-spacing:.04em}
  .tenant-meta{display:flex;gap:8px;font-size:11px;color:var(--muted)}
  .tenant-meta .dot{color:var(--line-2)}
  .nav{flex:1;overflow:auto;padding:10px 0 12px}
  .nav-section{margin-top:14px}
  .nav-section:first-child{margin-top:8px}
  .nav-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);padding:6px 18px 4px;display:flex;justify-content:space-between;align-items:center}
  .nav-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--line-2);letter-spacing:.05em}
  .nav-item{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:7px 18px 7px 14px;border-left:2px solid transparent;color:var(--ink-2);font-size:13px;cursor:pointer;position:relative}
  .nav-item:hover{background:var(--paper-3);color:var(--ink)}
  .nav-item.active{background:var(--paper-3);border-left-color:var(--accent);color:var(--ink);font-weight:500}
  .nav-mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--white);font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
  .nav-item.active .nav-mark{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
  .nav-count{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);min-width:18px;text-align:right}
  .nav-count.alert{color:var(--accent-2);font-weight:600}
  .nav-item.disabled{opacity:.35;pointer-events:none}
  .user-block{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--paper-2)}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.04em;flex:0 0 30px;border:1px solid var(--ink)}
  .avatar.bg-c{background:#2A4655;border-color:#2A4655}
  .user-meta{display:flex;flex-direction:column;min-width:0;flex:1}
  .user-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch-btn{border:1px solid var(--line-2);padding:5px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--paper);border-radius:2px;font-family:"JetBrains Mono",monospace}
  .switch-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* Top bar */
  .topbar{height:56px;border-bottom:1px solid var(--line);background:var(--paper);display:grid;grid-template-columns:1fr minmax(280px,440px) auto;align-items:center;gap:20px;padding:0 22px;position:sticky;top:0;z-index:5}
  .crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
  .crumb strong{color:var(--ink);font-weight:600;font-size:13.5px}
  .crumb .sep{color:var(--line-2)}
  .crumb .pulse{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--accent-2);padding:3px 7px;border:1px solid #D9BFA0;border-radius:2px;background:var(--warn-soft);letter-spacing:.04em}
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .search{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:12.5px;color:var(--muted)}
  .search:focus-within{border-color:var(--ink);background:var(--white)}
  .search svg{flex:0 0 14px;color:var(--muted)}
  .search input{border:0;background:transparent;outline:none;flex:1;font:inherit;color:var(--ink)}
  .search kbd{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:2px;padding:1px 5px;background:var(--paper)}
  .top-actions{display:flex;align-items:center;gap:10px}
  .icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink-2);position:relative}
  .icon-btn:hover{border-color:var(--ink);color:var(--ink)}
  .icon-btn .dot-badge{position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;padding:0 3px;background:var(--accent);color:var(--white);font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:600;border-radius:7px;display:grid;place-items:center;border:1.5px solid var(--paper)}
  .role-pill{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
  .role-pill:hover{border-color:var(--ink)}
  .role-pill .avatar{width:26px;height:26px;flex:0 0 26px;font-size:10px}
  .role-pill .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .role-pill .who b{font-size:12px;font-weight:600}
  .role-pill .who span{font-size:10.5px;color:var(--muted)}
  .role-pill .chev{color:var(--muted);margin-left:2px}

  /* Page content */
  .content{padding:18px 24px 60px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid var(--hairline);margin-bottom:16px;gap:24px}
  .page-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
  .page-title em{font-style:normal;color:var(--muted);font-weight:400}
  .page-sub{display:flex;gap:10px;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
  .page-sub .mono{color:var(--ink-2)}
  .page-sub .sep{color:var(--line-2)}
  .page-actions{display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--line-2);background:var(--paper);padding:7px 12px;font-size:12px;color:var(--ink);border-radius:3px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--ink)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn-disabled{opacity:.45;cursor:not-allowed;color:var(--muted)}
  .btn-disabled:hover{border-color:var(--line-2)}
  .btn .kbd{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted)}
  .btn-primary .kbd{color:var(--paper-3)}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--line-2)}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);background:var(--white);margin-bottom:14px}
  .kpi{padding:12px 14px;border-right:1px solid var(--hairline)}
  .kpi:last-child{border-right:0}
  .kpi-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .kpi-label .delta{font-family:"JetBrains Mono",monospace;letter-spacing:0;text-transform:none;font-size:10.5px}
  .kpi-label .delta.up{color:var(--pos)}
  .kpi-label .delta.dn{color:var(--neg)}
  .kpi-value{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
  .kpi-value small{font-size:12px;color:var(--muted);margin-left:4px}
  .kpi-foot{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi.warn .kpi-value{color:var(--neg)}

  /* Domain trail */
  .trail{
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;
    border:1px solid var(--line);background:var(--paper-2);margin-bottom:14px;
    border-top:0;
  }
  .trail-step{
    display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;
    padding:10px 14px;position:relative;border-right:1px solid var(--hairline);
  }
  .trail-step:last-child{border-right:0}
  .trail-step::after{
    content:"›";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;display:grid;place-items:center;background:var(--paper);
    color:var(--muted-2);font-size:14px;border:1px solid var(--hairline);border-radius:50%;z-index:1;
  }
  .trail-step:last-child::after{display:none}
  .trail-mark{
    width:30px;height:30px;display:grid;place-items:center;
    border:1px solid var(--line-2);background:var(--white);
    font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;color:var(--ink-2);
  }
  .trail-step.cur .trail-mark{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
  .trail-label{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .trail-label .role{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .trail-label .v{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trail-step.cur .trail-label .v{color:var(--accent-2)}

  /* Saved views & filters */
  .views{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .views-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .view-chip{
    font-size:12px;padding:5px 10px;border:1px solid var(--line-2);border-radius:14px;
    color:var(--ink-2);background:var(--paper);cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  }
  .view-chip:hover{border-color:var(--ink)}
  .view-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .view-chip .ct{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .view-chip.active .ct{color:var(--paper-3)}

  .filters{
    display:grid;
    grid-template-columns: 1fr 132px 152px 132px 152px auto;
    gap:8px;align-items:center;margin-bottom:10px;
  }
  .field-ctl{
    display:flex;align-items:center;gap:8px;background:var(--white);
    border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-size:12.5px;color:var(--ink);
    min-width:0;
  }
  .field-ctl:focus-within{border-color:var(--ink)}
  .field-ctl input,.field-ctl select{border:0;background:transparent;outline:none;width:100%;font:inherit;color:inherit;appearance:none}
  .field-ctl .lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .field-ctl .chev{color:var(--muted)}
  .lock-chip{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;padding:6px 10px;border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink-2);border-radius:3px;white-space:nowrap}
  .lock-chip svg{flex:0 0 10px}
  .filter-active{font-size:11.5px;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:center}
  .filter-active a{border-bottom:1px dotted var(--line-2)}
  .filter-active a:hover{color:var(--ink);border-color:var(--ink)}

  /* Workspace grid */
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:14px}
  .panel{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--hairline)}
  .panel-title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
  .panel-title em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.02em;text-transform:none}
  .panel-actions{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11.5px}
  .panel-actions a{border-bottom:1px dotted var(--line-2)}
  .panel-actions a:hover{color:var(--ink);border-color:var(--ink)}

  /* Table */
  table.t{width:100%;border-collapse:collapse;table-layout:fixed}
  table.t th,table.t td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--hairline);font-size:12.5px;vertical-align:middle}
  table.t th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;background:var(--paper-2);border-bottom:1px solid var(--line);padding:6px 14px;cursor:default}
  table.t td.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
  table.t tr:hover td{background:#FBF7EB}
  table.t tr.selected td{background:var(--select);border-bottom-color:#E0CC9C}
  table.t tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  table.t tr{cursor:pointer}
  table.t .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.t td .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  table.t .num{font-family:"JetBrains Mono",monospace;text-align:right;font-variant-numeric:tabular-nums}
  table.t th.num{text-align:right}
  table.t .kind-tag{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.04em;padding:1px 4px;border:1px solid var(--line-2);border-radius:2px;color:var(--muted-2);text-transform:uppercase;margin-right:6px;display:inline-block;vertical-align:1px}
  table.t .kind-tag.k-renewal{color:#3F6B3A;border-color:#B2C8A8;background:var(--pos-soft)}
  table.t .kind-tag.k-expansion{color:#2D5B6B;border-color:#A4C0C8;background:var(--info-soft)}
  table.t .kind-tag.k-service{color:#5C3A1E;border-color:#D9BFA0;background:#F0E2CE}
  table.t .kind-tag.k-discount{color:var(--accent-2);border-color:#D9BFA0;background:var(--warn-soft)}
  table.t .kind-tag.k-exception{color:#6B2E2E;border-color:#D6B0A8;background:var(--neg-soft)}

  /* Stage pip */
  .stage-pip{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
  .stage-pip i{width:6px;height:10px;background:var(--line);display:block}
  .stage-pip i.on{background:var(--ink)}
  .stage-pip i.flag{background:var(--accent)}
  .stage-label{font-size:11.5px;color:var(--muted);margin-left:6px;font-family:"JetBrains Mono",monospace;letter-spacing:.02em}

  /* Pills */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.04em;padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);background:var(--paper);text-transform:uppercase}
  .pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .pill.p-pending{color:var(--warn);border-color:#E2C887;background:var(--warn-soft)}
  .pill.p-pending .pdot{background:var(--warn)}
  .pill.p-approved{color:var(--pos);border-color:#B2C8A8;background:var(--pos-soft)}
  .pill.p-approved .pdot{background:var(--pos)}
  .pill.p-rejected{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
  .pill.p-rejected .pdot{background:var(--neg)}
  .pill.p-sentback{color:var(--info);border-color:#A4C0C8;background:var(--info-soft)}
  .pill.p-sentback .pdot{background:var(--info)}
  .pill.p-none{color:var(--muted)}
  .pill.p-overdue{color:var(--neg);border-color:#D6B0A8;background:var(--neg-soft)}
  .pill.p-overdue .pdot{background:var(--neg)}
  .pill.p-today{color:var(--accent-2);border-color:#D9BFA0;background:var(--warn-soft)}
  .pill.p-today .pdot{background:var(--accent)}

  /* Empty state */
  .empty{padding:48px 22px;text-align:center;color:var(--muted)}
  .empty .icon{margin:0 auto 12px;width:42px;height:42px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--muted-2);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em}
  .empty .ttl{color:var(--ink);font-size:13.5px;font-weight:500;margin-bottom:4px}
  .empty .reset{display:inline-block;margin-top:14px;border:1px solid var(--line-2);padding:5px 10px;font-size:12px;border-radius:3px;color:var(--ink-2)}
  .empty .reset:hover{border-color:var(--ink)}

  /* Preview */
  .preview{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 88px);overflow:auto}
  .preview-head{padding:14px 16px;border-bottom:1px solid var(--hairline);background:var(--paper-2)}
  .preview-kind{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .preview-kind .id{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .preview-title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .preview-acct{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
  .preview-acct .mono{color:var(--ink-2)}

  .preview-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--hairline)}
  .pf{padding:10px 14px;border-bottom:1px solid var(--hairline);border-right:1px solid var(--hairline);min-width:0}
  .pf:nth-child(2n){border-right:0}
  .pf:nth-last-child(-n+2){border-bottom:0}
  .pf .pf-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .pf .pf-v{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pf .pf-v .mono{font-weight:500}
  .pf .pf-v.num{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500}
  .pf-block{padding:12px 14px;border-bottom:1px solid var(--hairline)}
  .pf-block:last-child{border-bottom:0}

  return (

function DomainTrail({ opp }){
  const steps = [
    { code:"AC", role:"Account",     value:opp.account },
    { code:"CT", role:"Contact",     value:`${opp.contact} · ${opp.contactRole}` },
    { code:"OP", role:"Opportunity", value:`${opp.id} · ${opp.title.length>34?opp.title.slice(0,34)+"…":opp.title}`, current:true },
    { code:"AT", role:"Activity",    value:opp.next.title },
    { code:"AP", role:"Approval",    value: opp.approval==="none" ? "No active request" : opp.approvalDetail.split(" · ")[0] + " · " + opp.approval },
  ];
  return (
    <div className="trail" title="Domain chain · Account → Contact → Opportunity → Activity → Approval">
      {steps.map((s,i)=>(
        <div key={i} className={`trail-step ${s.current?"cur":""}`}>
          <div className="trail-mark mono">{s.code}</div>
          <div className="trail-label">
            <div className="role">{s.role}</div>
            <div className="v">{s.value}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

                  <button className="btn-primary btn" onClick={()=>{ setStep("form"); setForm(f=>({...f, title:"", amount:"", close:""})); }}>Create another</button>
                </div>
              </div>
            </div>
            <div className="drawer-foot">
              <span className="hint mono" style={{fontSize:11}}>OPP-2434 · STAGE {form.stage} · {fmtMoney(parseInt(String(form.amount).replace(/[^0-9]/g,""))||0)}</span>
              <button className="btn-ghost btn" onClick={onClose}>Done</button>
            </div>
          </>
        )}
      </aside>
    </>
  );
}

/* ─────────── Submit-for-approval modal ─────────── */

function SubmitModal({ opp, onClose, onConfirm }){
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="modal" role="dialog" aria-label="Submit for approval">
        <div className="modal-card">
          <div className="head">
            <h3>Submit {opp.id} for approval</h3>
            <p>This freezes the opportunity context (amount, stage, custom fields) at submission time. The approver will see this snapshot.</p>
          </div>
          <div className="body">
            <dl className="snap">
              <dt>Type</dt><dd>{opp.submit.requestType}</dd>
              <dt>Account</dt><dd>{opp.accountId} · {opp.account}</dd>
              <dt>Opportunity</dt><dd>{opp.id} · {opp.title.length>34?opp.title.slice(0,34)+"…":opp.title}</dd>
              <dt>Amount</dt><dd>{fmtMoney(opp.amount)}</dd>
              <dt>Stage</dt><dd>{STAGES[STAGE_INDEX[opp.stage]].label}</dd>
              <dt>Routes to</dt><dd>Finance · D. Smirnova → Legal · O. Markov (if needed)</dd>
            </dl>
            {opp.submit.warning && (
              <div style={{marginTop:10,fontSize:11.5,color:"var(--accent-2)",background:"var(--warn-soft)",border:"1px solid #E2C887",padding:"7px 10px"}}>
                <strong className="mono" style={{fontSize:10,letterSpacing:".1em",textTransform:"uppercase",marginRight:6}}>Note</strong>
                {opp.submit.warning}
              </div>
            )}
          </div>
          <div className="foot">
            <button className="btn" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={onConfirm}>Submit request</button>
          </div>
        </div>
      </div>
    </>
  );
}

/* ─────────── App ─────────── */

function App(){
  const [activeModule, setActiveModule] = useState("opps");
  const [view, setView] = useState("open");
  const [q, setQ] = useState("");
  const [stage, setStage] = useState("");
  const [account, setAccount] = useState("");
  const [close, setClose] = useState("");
  const [appr, setAppr] = useState("");
  const [selectedId, setSelectedId] = useState("OPP-2418");
  const [drawer, setDrawer] = useState(false);
  const [submitFor, setSubmitFor] = useState(null);
  const [toast, setToast] = useState(null);

  const resetFilters = () => { setQ(""); setStage(""); setAccount(""); setClose(""); setAppr(""); setView("open"); };

  // saved-view counts
  const counts = useMemo(()=>{
    const out = {};
    SAVED_VIEWS.forEach(v=>{ out[v.key] = OPPS.filter(v.test).length; });
    return out;
  }, []);

  // filtered rows
  const rows = useMemo(()=>{
    const v = SAVED_VIEWS.find(x=>x.key===view);
    return OPPS.filter(o=>{
      if(v && !v.test(o)) return false;
      if(q){
        const s = (o.title + " " + o.account).toLowerCase();
        if(!s.includes(q.toLowerCase())) return false;
      }
      if(stage && o.stage !== stage) return false;
      if(account && o.account !== account) return false;
      if(appr && o.approval !== appr) return false;
      if(close){
        const today = new Date(2026,4,12);
        const d = new Date(o.close);
        const days = (d - today) / (1000*60*60*24);
        if(close==="30" && days > 30) return false;
        if(close==="60" && days > 60) return false;
        if(close==="90" && days > 90) return false;
        if(close==="may" && !o.close.startsWith("2026-05")) return false;
      }
      return true;
    });
  }, [view, q, stage, account, close, appr]);

  // keep selection valid
  useEffect(()=>{
    if(rows.length && !rows.find(r=>r.id===selectedId)){
      setSelectedId(rows[0].id);
    }
  }, [rows, selectedId]);

  const opp = OPPS.find(o=>o.id===selectedId) || OPPS[0];

  function flashToast(text){
    setToast(text);
    setTimeout(()=>setToast(null), 2600);
  }

  return (
    <div className="app" data-screen-label="Sales Rep Workspace">
      <Sidebar activeModule={activeModule} onSelect={setActiveModule} />
      <div className="main">
        <TopBar />

        <div className="content">
          <div className="page-head">
            <div>
              <h1 className="page-title">My workspace <em>· Tuesday, May 12</em></h1>
              <div className="page-sub">
                <span className="mono">REP</span>
                <span className="sep">/</span>
                <span>Sales Representative landing</span>
                <span className="sep">·</span>
                <span>Owner-scoped</span>
                <span className="sep">·</span>
                <span className="mono">Q2 2026 · Local pilot tenant</span>
              </div>
            </div>
            <div className="page-actions">
              <button className="btn">New account</button>
              <button className="btn">+ Activity</button>
              {opp.submit.eligible
                ? <button className="btn" onClick={()=>setSubmitFor(opp)}>Submit for approval</button>
                : <button className="btn btn-disabled" aria-disabled="true" title={(opp.submit.reasons&&opp.submit.reasons[0])||"Not eligible"}>Submit for approval</button>}
              <button className="btn btn-primary" onClick={()=>setDrawer(true)}>New opportunity <span className="kbd">N</span></button>
            </div>
          </div>

          <KPIs opps={OPPS} />
          <DomainTrail opp={opp} />

          <ViewsRow active={view} onPick={(k)=>{ setView(k); }} counts={counts} />
          <FiltersRow
            q={q} setQ={setQ}
            stage={stage} setStage={setStage}
            account={account} setAccount={setAccount}
            close={close} setClose={setClose}
            appr={appr} setAppr={setAppr}
            onReset={resetFilters}
          />

          <div className="workspace">
            <OppTable
              rows={rows}
              selectedId={selectedId}
              onSelect={setSelectedId}
              onReset={resetFilters}
              totalRows={OPPS.length}
            />
            <Preview
              opp={opp}
              onAddActivity={()=>flashToast("Activity drawer would open · linked to "+opp.id)}
              onSubmitApproval={(o)=>setSubmitFor(o)}
            />
          </div>

          <div className="foot-ruler">
            <span>SALES OPS CRM · ORION INDUSTRIAL · LOCAL PILOT</span>
            <span>USER REP · AP</span>
            <span>POLICY v18 · METADATA v42 · SHELL v2.4</span>
          </div>
        </div>
      </div>

      {drawer && <NewOpportunityDrawer onClose={()=>setDrawer(false)} onCreated={(id)=>{ flashToast("Opportunity "+id+" created"); }} />}
      {submitFor && (
        <SubmitModal
          opp={submitFor}
          onClose={()=>setSubmitFor(null)}
          onConfirm={()=>{ setSubmitFor(null); flashToast("Approval request submitted for "+submitFor.id+" · routed to Finance"); }}
        />
      )}
      {toast && (
        <div className="toast"><span className="ok">✓</span>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
