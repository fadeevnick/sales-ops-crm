name: Pilot Smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  pilot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Run pilot smoke gate
        run: codebase/scripts/ci-pilot-smoke.sh

