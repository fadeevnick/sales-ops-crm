name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: salesops-crm-pilot
  GCP_REGION: europe-west3
  GAR_REPOSITORY: salesops-docker

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve backend image
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ inputs.release_tag }}"
          registry_host="${GCP_REGION}-docker.pkg.dev"
          registry_prefix="${registry_host}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"
          backend_image="${registry_prefix}/salesops-backend:${release_tag}"

          {
            echo "release_tag=${release_tag}"
            echo "backend_image=${backend_image}"
          } >> "${GITHUB_OUTPUT}"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute migration job on target image
        run: |
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_MIGRATION_JOB }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --execute-now \
            --wait

      - name: Deploy backend service revision
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
