name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: salesops-crm-pilot
  GCP_REGION: europe-west3
  GAR_REPOSITORY: salesops-docker
  CLOUD_SQL_CONNECTION_NAME: salesops-crm-pilot:europe-west3:salesops-postgres
  CLOUD_SQL_DATABASE: salesops
  CLOUD_SQL_USERNAME: salesops
  CLOUD_RUN_SERVICE_ACCOUNT: salesops-backend-sa@salesops-crm-pilot.iam.gserviceaccount.com
  APP_ALLOWED_ORIGIN: https://sales-ops-crm.duckdns.org

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve backend image
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ inputs.release_tag }}"
          registry_host="${GCP_REGION}-docker.pkg.dev"
          registry_prefix="${registry_host}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"
          backend_image="${registry_prefix}/salesops-backend:${release_tag}"

          {
            echo "release_tag=${release_tag}"
            echo "backend_image=${backend_image}"
          } >> "${GITHUB_OUTPUT}"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute migration job on target image
        run: |
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_MIGRATION_JOB }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --service-account "${CLOUD_RUN_SERVICE_ACCOUNT}" \
            --add-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --set-env-vars "SPRING_DATASOURCE_URL=jdbc:postgresql:///${CLOUD_SQL_DATABASE}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&ipTypes=PUBLIC&cloudSqlRefreshStrategy=lazy,SPRING_DATASOURCE_USERNAME=${CLOUD_SQL_USERNAME},APP_ALLOWED_ORIGIN=${APP_ALLOWED_ORIGIN}" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=salesops-db-password:latest,APP_TOKEN_SECRET=salesops-app-token-secret:latest" \
            --max-retries 0 \
            --tasks 1 \
            --command java \
            --args=-jar,/app/salesops-backend.jar,--spring.main.web-application-type=none,--spring.flyway.enabled=true,--app.mode=migrate \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --execute-now \
            --wait

      - name: Deploy backend service revision
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --service-account "${CLOUD_RUN_SERVICE_ACCOUNT}" \
            --add-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --set-env-vars "SPRING_DATASOURCE_URL=jdbc:postgresql:///${CLOUD_SQL_DATABASE}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&ipTypes=PUBLIC&cloudSqlRefreshStrategy=lazy,SPRING_DATASOURCE_USERNAME=${CLOUD_SQL_USERNAME},SPRING_FLYWAY_ENABLED=false,APP_ALLOWED_ORIGIN=${APP_ALLOWED_ORIGIN}" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=salesops-db-password:latest,APP_TOKEN_SECRET=salesops-app-token-secret:latest" \
            --allow-unauthenticated \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
