name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: salesops-crm-pilot
  GCP_REGION: europe-west3
  GAR_REPOSITORY: salesops-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          registry_host="${GCP_REGION}-docker.pkg.dev"
          registry_prefix="${registry_host}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"
          backend_image="${registry_prefix}/salesops-backend:${release_tag}"

          {
            echo "release_tag=${release_tag}"
            echo "backend_image=${backend_image}"
          } >> "${GITHUB_OUTPUT}"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build backend image
        working-directory: codebase
        run: docker build -t "${{ steps.meta.outputs.backend_image }}" ./backend

      - name: Push backend image
        run: docker push "${{ steps.meta.outputs.backend_image }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: codebase/frontend
        run: npm ci

      - name: Build frontend static release
        working-directory: codebase/frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ steps.meta.outputs.release_tag }}
          path: codebase/frontend/dist
          if-no-files-found: error
