name: PR / Main CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    container: gradle:8.14.3-jdk21
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and test backend
        working-directory: codebase/backend
        run: gradle --no-daemon test bootJar

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: codebase/frontend
        run: npm ci

      - name: Build frontend
        working-directory: codebase/frontend
        run: npm run build

  compose-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose config
        working-directory: codebase
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet

  smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-build-test
      - frontend-build
      - compose-sanity
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Run smoke gate
        working-directory: codebase
        run: scripts/ci/ci-pilot-smoke.sh
